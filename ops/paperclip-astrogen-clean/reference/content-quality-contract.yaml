version: 1
contract: astrogen-content-quality
appliesTo: astrogen-article-production

publishableArtifactBoundary:
  sectionClassificationRequired: true
  allowedClasses: [readerFacing, handoffOnly]
  handoffOnlyAlwaysIncludes:
    - CMS or media field inventories
    - revision, run, issue, document or attachment identifiers
    - publication blockers and stage instructions
    - validation or recovery instructions
    - source, provenance, cache or cost telemetry
    - editorial signals and the section title Редакційні сигнали та медіа-поля
  rules:
    - only readerFacing sections may enter article main content
    - handoffOnly material stays in case documents, artifact metadata or handoff notes outside the delimited article body
    - a provider numbering an operational item as a section never makes it readerFacing
    - on validate-to-draft return, the latest validation document overrides the older brief for named corrections

cmsReadyEnvelope:
  requiredNonEmptyFields:
    - seoTitle
    - metaDescription
  producerStage: layout
  validatorStage: layout_validate

