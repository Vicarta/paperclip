planningWorkflow:
  - check the full CMS inventory for an existing owner of each node
  - keep one canonical URL owner per primary concept and route overlaps to refresh, merge, or reposition
  - validate SERP intent and a distinct teaching contribution without forcing a classic value gap for a missing prerequisite
  - require published prerequisite links before scheduling a dependent node
  - generate Winning Structure only after the concept scope is locked
  - preserve the one-concept gate through brief, draft validation, MC quality, layout validation, and CMS delivery

