version: astrogen-western-astrology-curriculum-v1
company: astrogen
language: uk
portfolioTrack: western_astrology_learning

teachingContract:
  newConceptsPerArticle: 1
  rule: One article introduces and teaches exactly one new astrology concept.
  aliasesDoNotCreateConcepts: true
  aliasRule: A Ukrainian synonym or spelling variant may clarify the primary concept once, but it must not become a second teaching subject.
  unfamiliarTerms:
    allowedOnlyWhen:
      - the term is the primary concept of this article
      - the term has a published prerequisite article linked at first meaningful use
      - the term is replaced with ordinary non-astrological language
    forbiddenPatterns:
      - glossary dump
      - list of adjacent concepts with definitions
      - overview of twelve houses or twelve signs inside a single beginner article
      - interpretation workflow that requires concepts not yet taught
      - treating adjacent terminology as bounded supporting context
  unavoidableSupportingTerm:
    maximumPerArticle: 1
    rule: If accurate explanation requires one adjacent technical word, define it immediately in ordinary language and stop there.
    forbiddenDepth:
      - own heading or subsection
      - table, list, FAQ, comparison, worked example, or interpretation workflow
      - treating the term as a second learning objective
    evidence: Record the term, one-sentence definition, first-use section, and necessity in supportingTermGlossary; validators must set supportingTerminologyStatus=passed.
  titleRule: Title and H1 name only the primary concept and the reader question it resolves.
  briefRule: The brief declares one primaryConceptKey, one introducedConceptKeys item, known prerequisite concepts, and excluded future concepts.
  validationRule: Any unexplained astrology term outside the primary concept or published prerequisites returns the article for substantive revision.
  deliveryRule: CMS draft delivery is forbidden until the one-concept gate passes after humanization.

canonicalTerminology:
  house:
    preferredUk: дім
    acceptedAliasesUk: [будинок, дом]
    note: Treat all three words as aliases for one concept; use "дім" in the canonical title and explain an alias only when useful for search comprehension.

