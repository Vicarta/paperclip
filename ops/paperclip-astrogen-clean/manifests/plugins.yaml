plugins:
  active:
    - key: paperclip-plugin-telegram
      packagePath: /app/packages/plugins/plugin-telegram
      owner: OPS Human Interaction Agent
      verification: config validation, no owner-facing spam
      safety:
        enableProactiveWatches: false
        maxSuggestionsPerHourPerCompany: 0
    - key: paperclip.payload-cms-agent-tools
      packagePath: /app/packages/plugins/plugin-payload-cms-agent-tools
      owner: Chief Technical Officer
      verification: Payload health/build-state read
    - key: paperclip.gsc-bing-ga4-mcp-agent-tools
      packagePath: /app/packages/plugins/plugin-gsc-bing-ga4-mcp-agent-tools
      owner: SEO Performance Analyst
      verification: Astrogen site/property read-only tool call
    - key: paperclip.crawlobserver-agent-tools
      packagePath: /app/packages/plugins/plugin-crawlobserver-agent-tools
      owner: SEO Performance Analyst
      verification: CrawlObserver project/session read
    - key: paperclip.email-notifications
      packagePath: /app/packages/plugins/plugin-email-notifications
      owner: Chief Technical Officer
      verification: dry-run plus live owner change-report and structured Ukrainian weekly SEO report through Resend
      safety:
        recipients: "explicit allowlist only; default o.savitsky@gmail.com"
        idempotency: required or deterministic fallback
        costAccountingMode: estimated_per_email
    - key: paperclip.openrouter-image-agent-tools
      packagePath: /app/packages/plugins/plugin-openrouter-image-agent-tools
      owner: SEO Blog Image Runtime Executor
      verification: provider config resolves image key
      safety:
        maxImagesPerRequest: 1
        targetDimensionTolerancePercent: 20
        preserveOriginalWithinTolerance: true
        noRetryForDimensionOrFormatOnly: true
        requireSubjectMode: true
        structuredArtDirectionMode: required_for_human_scene
        visualHistoryLimit: 8
        minimumDistinctVisualAxes: 4
    - key: paperclip.serper-agent-tools
      packagePath: /app/packages/plugins/plugin-serper-agent-tools
      owner: MKT Competitive Intelligence Analyst
      verification: bounded Google SERP retrieval for value-gap analysis
      safety:
        costAccountingMode: estimated_per_request
        maxResultsPerQuery: 10
    - key: paperclip.winning-structure-mcp-agent-tools
      packagePath: /app/packages/plugins/plugin-winning-structure-mcp-agent-tools
      owner: MKT Competitive Intelligence Analyst
      verification: private MCP tools/list includes all five lifecycle operations; Phase 32/33 validation preserves gist_enabled and versioned project cost policy
      safety:
        endpointExposure: private Tailscale only
        clientKey: astrogen-ukraine
        tokenStorage: company-scoped Paperclip secret
        costAccountingMode: provider_reported
        costLedgerEligibility: estimation_status=estimated and telemetry_status=complete only
        partialCostHandling: persist lower bound in evidence, never ledger as total
        gistDefaultEnabled: true
        evidenceRoutingPolicy: /companies/astrogen/reference/winning-structure-policy.yaml
        publicationOutput: forbidden
    - key: paperclip.semantic-core-mcp-agent-tools
      packagePath: /app/packages/plugins/plugin-semantic-core-mcp-agent-tools
      owner: SEO Blog Content Strategist
      verification: authenticated list-tools, fixture trend report, local inventory and bounded SERP tool smoke
      safety:
        localInventoryReadOnly: true
        maxRowsPerCall: 50
        rawImportPayloadExposure: forbidden
        endpointExposure: private Tailscale only
        semanticValidationProjectId: astrogen-ukraine
        trendProjectId: astrogen-audience-trends-ukraine
        trendProductSeeds: forbidden
        tokenStorage: company-scoped Paperclip secret
        trendReportEntity: semantic-core-trend-topic-report
        trendSemanticImport: forbidden
        trendDirectTopicCreation: forbidden
        providerExecutionPolicy: explicitly approved_candidate_batch; 1-10 exact phrases only, Standard queue, no Search Intent or inline parsing
        trendLiveExecution: explicitly enabled with private-project use_cache; MCP mode=provider remains intentional and bounded by this plugin policy
        paidCandidateBatchLimit: 10
        providerQueue: standard
        searchIntentEnrichment: forbidden in autonomous runs
        contentParsingEnrichment: separate explicitly approved evidence request only; 1-3 public URLs, Standard queue, max 50 terms per URL, no Markdown/browser rendering
        providerCacheRefreshOrBypass: forbidden in autonomous runs
        trendCostAccounting: prefer numeric USD actual_cost; estimated_cost only when provider actual is unavailable
        trendExecutionTimeoutMs: 360000

  parked:
    - key: paperclip.collaborator-agent-tools
      packagePath: /app/packages/plugins/plugin-collaborator-agent-tools
      reason: backlink/provider workflow can create external obligations
    - key: paperclip.dataforseo-agent-tools
      packagePath: /app/packages/plugins/plugin-dataforseo-agent-tools
      reason: old live row currently fails worker load; require packaging fix
    - key: paperclip.exa-agent-tools
      packagePath: /app/packages/plugins/plugin-exa-agent-tools
      reason: old live row currently fails worker load; require packaging fix
    - key: paperclip.bright-data-agent-tools
      packagePath: /app/packages/plugins/plugin-bright-data-agent-tools
      reason: explicit crawling budget approval required
    - key: paperclip.search-console-mcp-agent-tools
      packagePath: /app/packages/plugins/plugin-search-console-mcp-agent-tools
      reason: superseded by gsc-bing-ga4 plugin
    - key: paperclip.diskinternals-bigquery-growth
      packagePath: /app/packages/plugins/plugin-diskinternals-bigquery-growth
      reason: cross-company plugin, never enable for Astrogen clean
    - key: paperclip.perfex-crm-agent-tools
      packagePath: /app/packages/plugins/plugin-perfex-crm-agent-tools
      reason: not part of Astrogen traffic/SEO bootstrap

policy:
  companyScope: store Astrogen settings in plugin_company_settings and mirror only safe single-company config where legacy plugin runtime requires plugin_config
  activation: parked plugins stay disabled until a separate smoke/approval issue
  telegram: proactive watches stay disabled until explicitly re-enabled
