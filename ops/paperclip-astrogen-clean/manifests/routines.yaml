routines:
  - title: Daily Astrogen deterministic evidence collection
    owner: SEO Performance Analyst
    status: active
    triggerEnabled: true
    cron: "10 6 * * *"
    timezone: Europe/Kiev
    concurrencyPolicy: coalesce_if_active
    catchUpPolicy: skip_missed
    workflow: seo_performance_loop
    activationGate: plugin smoke plus registry write test
    processContract:
      canonicalTarget:
        - primary domain is https://astrogen.com.ua
        - GSC property is sc-domain:astrogen.com.ua
        - Payload CMS base is https://cms.astrogen.com.ua/api
        - app-store/developer-site evidence is secondary only and must not replace the canonical target
      toolingPath:
        - use /api/agents/me/plugin-tools and /api/agents/me/plugin-tools/execute with the run token when no native wrapper is available
        - do not use board-only plugin/admin routes from an agent heartbeat
        - route a CTO configuration issue when configured plugin tools are not callable
      bounds:
        - inspect at most 25 URLs unless a linked issue explicitly authorizes more
        - compact deterministic evidence before any LLM reasoning
        - request at most 10 rows per source by default
        - never print raw plugin JSON or API payloads
      allowedSideEffects:
        - store one compact evidence packet on the routine issue
        - ingest or update canonical astrogen-growth-actions cases by stable finding fingerprint
        - record explicit no-action evidence
      forbidden:
        - publish CMS content
        - send Telegram messages
        - run paid crawl/search/image providers
        - create article-production tasks
      completionGate: action queue, watch/cooldown decision, or explicit no-action packet with source timestamps

  - title: Daily Astrogen due-URL GSC indexing audit
    owner: SEO GSC Indexing Auditor
    status: active
    triggerEnabled: true
    cron: "20 6 * * *"
    timezone: Europe/Kiev
    concurrencyPolicy: coalesce_if_active
    catchUpPolicy: skip_missed
    workflow: technical_seo_finding
    activationGate: URL Inspection smoke with quota/cooldown ledger
    processContract:
      canonicalTarget:
        - inspect only URLs under https://astrogen.com.ua unless explicitly authorized
        - GSC property is sc-domain:astrogen.com.ua
      toolingPath:
        - use /api/agents/me/plugin-tools and /api/agents/me/plugin-tools/execute with the run token when no native wrapper is available
        - do not use board-only plugin/admin routes from an agent heartbeat
      bounds:
        - inspect at most 10 due URLs per run
        - use sitemap discovery only when registry is empty, capped at 20 URLs for registration
        - never print raw inspection/plugin JSON
      allowedSideEffects:
        - ingest or update canonical astrogen-growth-actions cases by stable URL plus root-cause fingerprint
        - record inspected, skipped, no-data, and cooldown decisions
      forbidden:
        - request indexing in bulk
        - mutate CMS content
        - send Telegram messages
        - spend paid provider budget
      completionGate: every selected URL has finding routed, cooldown/watch recorded, skipped reason, or explicit no due URLs

  - title: Daily Astrogen leadership backlog triage
    owner: CEO
    status: active
    triggerEnabled: true
    cron: "40 6 * * *"
    timezone: Europe/Kiev
    concurrencyPolicy: coalesce_if_active
    catchUpPolicy: skip_missed
    workflow: leadership_backlog_triage
    activationGate: active portfolio continuity control
    processContract:
      inputs:
        - unassigned backlog, todo, blocked, and in-review work
        - blocked issues older than 24 hours
        - repeated findings for the same URL or root cause
        - priority workstreams with no executable non-blocked path
      routing:
        - CEO prioritizes, routes, and delegates through native growth pipeline cases; CEO does not execute specialist work
        - classify blockers as internal recovery, external developer wait, owner decision, obsolete, or superseded
        - one blocker must never freeze an unrelated workstream
        - repeated evidence updates one canonical growth case by stable finding fingerprint
        - existing issue routing uses only the standard assignee plus todo/backlog transition and a concise comment
        - that route applies only to genuinely unassigned actionable backlog/todo work; assigned or blocked foreign-owned issues become evidence on a canonical native growth case
        - CEO never cancels or rewrites another agent's issue or blocker graph; terminal and dependency state belongs to the case owner or deterministic pipeline transition
        - a 403 on foreign issue mutation is a routing error; stop that mutation, use the growth case, and continue other portfolio lanes
      bounds:
        - process at most 10 candidates per run
        - use compact heartbeat context and recent evidence
      completionGate: no stale unclassified blocker, no old unassigned actionable item, and each current company priority has a canonical native growth case with an executable delegated path or durable typed wait evidence

  - title: Astrogen article slot allocator
    owner: Chief Marketing Officer
    status: active
    triggerEnabled: true
    cron: "0 10 * * *"
    timezone: Europe/Kiev
    concurrencyPolicy: skip_if_active
    catchUpPolicy: enqueue_missed_with_cap
    workflow: article_cadence
    activationGate: controlled clean activation, target 1 CMS draft per day
    processContract:
      orchestration:
        - astrogen-topic-inventory and astrogen-article-production native pipelines are the source of truth
        - only the scheduled allocator dispatches a ready topic; ready-stage automation must not auto-reserve it
        - the allocator calls native case breakdown once to create or reuse one article case and atomically advance the topic to reserved
        - pipeline stage automation owns specialist dispatch, typed transitions, recovery, and completion evidence
      activationMode:
        - target 1 new CMS draft per Europe/Kiev day
        - schedule daily at 10:00 Europe/Kiev
        - bounded article-only catch-up may deliver up to maxCatchUpSlotsPerRun when explicitly configured
      bounds:
        - at most one new article slot per routine execution
        - never use broad catch-up outside the article cadence contract
        - use a productive WIP cap of 3 non-blocked article parents; blocked or externally waiting parents do not consume productive WIP capacity
        - never create a duplicate parent for the same articleParentKey, even when the canonical parent is blocked
        - when one article is blocked, continue an unrelated ready topic if the productive WIP cap and daily/catch-up quota allow it
        - no-safe-topic is a canonical native growth-case refill trigger, not a successful terminal state
      topicInventoryRefill:
        - allocator consumes only astrogen-topic-inventory cases at stage ready
        - if fewer than 3 ready topics exist, ingest or update one astrogen-growth-actions case with fingerprint topic-inventory-refill:{ISO-week}
        - never create a legacy refill issue tree from the allocator
        - refill uses Payload CMS, GSC/GA4, semantic-core inventory/review, CrawlObserver, active issue duplicate checks, and consumed topic history
        - weekly CMO planning ingests 3-10 stable candidate topic cases; candidate and evidence-ready automations validate them
        - if tools are unavailable, attach one typed blocker to the refill growth case instead of asking the owner for topics or stopping unrelated work
      atomicDispatch:
        - call POST /api/cases/{topicCaseId}/breakdown with one item keyed by topicKey:reservation-v{topicCaseVersion}
        - ready-stage breakdown targets astrogen-article-production opportunity and advances the topic to reserved
        - record the returned child article case id as consumingArticleCaseId and set a bounded reservation expiry
        - topic case version is the reservation generation; retries of the same generation reuse one child, while a released topic creates a new child on its newer version
        - native requestKey and caseKey provide per-generation idempotency; do not create article, brief, writer, or recovery issue trees
      writerRecovery:
        - primary writer is SEO Blog Article Writer (Claude)
        - ChatGPT fallback only after recorded Claude/OpenRouter blocker, missing canonical artifact, repeated same-class failure, or explicit CMO recovery
        - writer slot is incomplete without canonical draft artifact or explicit no-draft blocker
      imageGate:
        - normal new articles require accepted cover image unless owner explicitly waives image generation
        - use human_scene for human experience, decisions, relationships, family, children, career, money, emotions, consultation, or personal context
        - normal cover generation uses exactly one provider call for one image; human-scene prompts may use natural camera/viewer gaze when useful, but do not create three-candidate sets by default
        - image generation is visually sensitive and non-deterministic, so preserve a good result instead of degrading it through mechanical resizing or repeated generation
        - request the preferred CMS target 1472x822, then accept the original provider image when visual QA passes and actual width and height each differ from the target by no more than 20 percent
        - do not upscale, stretch, crop, or call the provider again solely because dimensions or output format differ within tolerance; preserve the accepted original asset
        - a dimension miss beyond 20 percent is a runtime contract blocker for CTO, not authorization for an automatic second generation
        - use abstract_graphic for abstract concepts, definitions, zodiac-sign profiles, generic horoscope topics, frameworks, lists, comparisons, metrics, or non-personal explanations
        - abstract_graphic covers must not contain people, faces, hands, bodies, silhouettes, or model-like figures
      parentCompletionGate:
        - canonical article parent remains open until accepted cover image or explicit waiver, authenticated CMS draft/admin URL, verified CTA/editorial/relatedPosts gates, and CMO Telegram article-link proof exist
        - notification-contract is message content only; CMO must directly execute the discovered telegram_send_message agent tool with the parent issueId
        - Telegram completion proof requires ok=true, a non-empty messageId, and plugin delivery-proof writeback; an intended message or done event is not proof
        - notification transport recovery affects only delivery for that article and never consumes productive article WIP or freezes unrelated SEO/content lanes
        - CMS specialists write delivery and before-after evidence on their own child issue; CMO aggregates verified child evidence into the parent it owns
        - ready_for_image_handoff, layout-ready, CMS-ready, or all-current-children-done is progress evidence, not parent completion
        - if no active child exists and delivery proof is missing, resume the same parent and route the next missing stage instead of creating a duplicate article parent
      allowedSideEffects:
        - dispatch one ready native topic through breakdown when gates pass
        - ingest or update one canonical native refill growth case when inventory is below the low-water mark
      forbidden:
        - generate images in the allocator
        - publish CMS content
        - send owner-facing Telegram from the allocator
        - create broad semantic-core or competitor-research batches
      completionGate: one native article case is live from breakdown, quota is satisfied, productive WIP is full, or one canonical refill growth case is live for low or empty inventory
    variables: []

  - title: Weekly Astrogen SEO/GEO action cycle
    owner: SEO Performance Analyst
    status: active
    triggerEnabled: true
    cron: "0 9 * * 3"
    timezone: Europe/Kiev
    concurrencyPolicy: coalesce_if_active
    catchUpPolicy: skip_missed
    workflow: seo_performance_loop
    activationGate: joined GSC/GA4/CrawlObserver/Payload evidence smoke
    processContract:
      canonicalTarget:
        - primary domain is https://astrogen.com.ua
        - GSC property is sc-domain:astrogen.com.ua
        - app-store/developer-site mismatches are findings, not a replacement target
      toolingPath:
        - use /api/agents/me/plugin-tools and /api/agents/me/plugin-tools/execute with the run token when no native wrapper is available
        - do not use board-only plugin/admin routes from an agent heartbeat
      bounds:
        - use compact evidence only
        - create only high-confidence child issues
        - prefer watch/cooldown/no-action decisions over speculative work
        - use top 5-10 deltas and never print raw plugin JSON
      allowedSideEffects:
        - route child issues for technical fixes, content refreshes, monitoring, owner SEO decisions through Hermes/CMO, or strategy review
        - produce concise internal weekly report evidence
        - send the detailed weekly SEO report by email when the SEO Performance Loop delivery plan says email is configured
      contentRefreshContract:
        - content_refresh means improving an existing article's body/content through the native article pipeline after one durable Winning Structure run for the refresh revision
        - required evidence is an imported Winning Structure result with ownership/cannibalization boundaries, reader-value evidence or fulfilled commitment, accepted sections, content quality requirements, publication requirements, and exact sections that need substantive improvement
        - supporting Serper evidence may be included in strategy_input but never completes or bypasses the Winning Structure gate
        - do not route content_refresh as generic insertion of Коротко, FAQ, CTA, comparison block, internal links, relatedPosts, or metadata-only edits
        - FAQ, comparison, CTA, relatedPosts, or structured blocks are allowed only when the accepted reader-value contribution explicitly justifies them
        - refresh preserves accepted existing cover/media unless the issue explicitly scopes an image defect
        - editorial/layout defects stay in the editorial_backfill/layout repair lane; metadata, internal-link-only, and relatedPosts-only fixes stay in deterministic CMS/SEO fixer lanes
      emailDeliveryContract:
        - call paperclip.seo-performance-loop:seo-weekly-report-plan-get before finalizing the report
        - write for a non-technical company owner in simple Ukrainian; explain business meaning first and keep tool names, payload details, and internal implementation terms out of the main summary
        - the first section must say what Paperclip will do next; every action must name the existing issue or native case, accountable agent, current status, exact next step, and review date when known
        - separate executable actions from watch/cooldown/no-action decisions; never present a blocked or external-wait issue as completed work
        - when detailedReportChannel=email and deliveryReady=true, call paperclip.seo-performance-loop:seo-detailed-report-email-send with the structured report object and an issue-scoped idempotency key; the plugin renders safe HTML plus a plain-text fallback
        - set ownerAction only when the owner can make a concrete decision; otherwise state plainly that no owner action is required
        - record email delivery proof in the issue thread without exposing raw secrets or provider payloads
        - if configured email delivery fails, create or link a CTO-owned email transport blocker and do not silently fall back to comment-only completion
        - if email is not ready, keep the detailed report as Paperclip evidence and create or link a CTO blocker naming the missing sender, recipients, or Resend secret-ref
      forbidden:
        - publish CMS content
        - send Telegram by default
        - run paid providers without a linked budget approval
        - create article slots directly
        - close done with only an internal comment when email delivery is configured
      completionGate: action issues, Hermes/CMO owner-brief decisions, watch/cooldown decisions, or explicit no-action evidence recorded, plus detailed weekly SEO email delivery proof or a linked CTO-owned email transport blocker

  - title: Weekly Astrogen CMO growth portfolio plan
    owner: Chief Marketing Officer
    status: active
    triggerEnabled: true
    cron: "15 10 * * 3"
    timezone: Europe/Kiev
    concurrencyPolicy: coalesce_if_active
    catchUpPolicy: skip_missed
    workflow: growth_portfolio_control
    activationGate: active after weekly SEO/GEO action cycle
    processContract:
      requiredLanes:
        - content supply and Winning Structure-driven refresh
        - technical SEO and indexing
        - GEO and entity visibility
        - conversion, revenue, and measurement learning
      managementBoundary:
        - CMO chooses priorities, outcome targets, owners, sequence, and WIP
        - CMO delegates execution and does not perform specialist work
      continuity:
        - one blocker affects only its own case or dependency chain
        - blocked and external-wait items do not consume productive WIP
        - unrelated safe work continues
        - repeated findings update one canonical remediation issue
      output:
        - weekly-growth-plan document with 3-7 evidence-backed actions when safe actions exist
        - ingest or update 3-10 evidence-backed astrogen-topic-inventory cases at candidate with stable topic keys
        - keep ready inventory target 10 and low-water mark 3; a Markdown-only content plan is incomplete
        - every accepted action is delegated or linked to an executable existing issue or pipeline case
        - record ready-topic inventory, productive and blocked article WIP, CMS drafts delivered, and SEO actions completed
      completionGate: accepted actions delegated or linked, blockers classified, and unrelated lanes continue; otherwise durable no-safe-action evidence

  - title: Monthly Astrogen trend discovery
    owner: Chief Marketing Officer
    status: active
    triggerEnabled: true
    cron: "0 8 1 * *"
    timezone: Europe/Kiev
    concurrencyPolicy: coalesce_if_active
    catchUpPolicy: skip_missed
    workflow: monthly_trend_discovery
    activationGate: current GSC/GA4, semantic-core, product, and approved external-signal evidence available
    processContract:
      purpose:
        - identify evidence-backed durable shifts, emerging demand, seasonal recurrences, and plausible early signals
        - feed typed hypotheses into CMO portfolio review without creating article work
      inputs:
        - completed-period GSC/GA4 and site-search changes
        - semantic-core evidence and current topic inventory
        - verified Astrogen product, expert, service, and audience changes
        - approved SERP/competitor and public/community signals with source timestamps
        - active growth cases and consumed topic history
      bounds:
        - inspect at most 20 compact candidate signals
        - retain at most 8 typed hypotheses per run
        - require at least two independent signals or one first-party signal plus a concrete validation plan
        - every hypothesis has a falsifier, expiry, and stable fingerprint
      allowedSideEffects:
        - store one monthly hypothesis document
        - update the CMO portfolio evidence packet by stable hypothesis fingerprint
        - route a bounded evidence-validation growth case when the next step is concrete
      forbidden:
        - create astrogen-topic-inventory or astrogen-article-production cases directly
        - treat a hypothesis as an approved topic or fact
        - use model memory as current trend evidence
        - mutate or publish CMS content
        - generate images or send Telegram messages
      completionGate: typed observe/validate/reject/expired hypotheses or explicit no-supported-trend evidence; never an article task

  - title: Monthly Astrogen scaled-content audit
    owner: SEO Performance Analyst
    status: active
    triggerEnabled: true
    cron: "30 8 2 * *"
    timezone: Europe/Kiev
    concurrencyPolicy: coalesce_if_active
    catchUpPolicy: skip_missed
    workflow: monthly_scaled_content_audit
    activationGate: deterministic similarity candidate packet available from current CMS inventory
    processContract:
      purpose:
        - find repeated-template or near-duplicate article clusters with weak independent reader value
        - protect the portfolio without inferring a sitewide verdict from one page or one Winning Structure run
      deterministicPreselection:
        - compare normalized titles, heading trees, main-content semantics, section-purpose sequences, value generators, and entity-substitution patterns
        - remove shared navigation, footer, legal/safety text, Коротко, CTA, relatedPosts, CMS chrome, metadata, and decorative media before substantive comparison
        - send only bounded candidate clusters and compact evidence to LLM review
      bounds:
        - inspect at most 5 candidate clusters or 50 URLs per run
        - do not audit unrelated pages when deterministic selection found no candidate cluster
        - one blocked cluster does not stop remaining clusters
      allowedSideEffects:
        - store one monthly cluster audit document
        - ingest or update astrogen-growth-actions cases for keep, differentiate, consolidate, refresh, or park recommendations using stable fingerprints
        - record explicit no-risk or insufficient-evidence outcomes
      forbidden:
        - mutate CMS content or publish
        - create article-production tasks directly
        - call shared layout components substantive duplication evidence
        - label generation itself as spam without observed low-value or derivative output
        - send Telegram messages
      completionGate: every selected cluster has a typed recommendation routed by stable fingerprint, or explicit no-candidate/insufficient-evidence proof

  - title: Weekly Astrogen CEO business direction review
    owner: CEO
    status: active
    triggerEnabled: true
    cron: "0 11 * * 3"
    timezone: Europe/Kiev
    concurrencyPolicy: coalesce_if_active
    catchUpPolicy: skip_missed
    workflow: executive_direction_review
    activationGate: active after CMO growth portfolio plan
    processContract:
      scope:
        - revenue and product readiness
        - customer value and delivery capacity
        - marketing growth and measurement quality
        - platform risk and missing future capabilities
      managementBoundary:
        - CEO delegates growth to CMO and platform or integration work to CTO
        - CEO does not execute specialist work
      requiredDecision:
        - confirm, reorder, narrow, or stop current company bets
        - ensure every selected bet has an outcome metric, accountable manager, executable path, and review date
        - ensure no isolated blocker freezes unrelated company work
      completionGate: concrete delegations, explicit continuation of existing bets, or durable evidence-backed no-change decision

  - title: Weekly Paperclip clean release check
    owner: Chief Technical Officer
    status: active
    triggerEnabled: true
    cron: "0 6 * * 2"
    timezone: Europe/Kiev
    concurrencyPolicy: coalesce_if_active
    catchUpPolicy: skip_missed
    workflow: paperclip_release_check
    activationGate: clean runtime provenance check
    processContract:
      bounds:
        - read-only health, provenance, and upstream-release comparison only
      allowedSideEffects:
        - create CTO follow-up only for missing provenance, failing health, or release review
        - record explicit no-action evidence
      forbidden:
        - rebuild, restart, pull images, deploy, or edit production config
        - change plugin state
        - notify owner directly
      completionGate: health/provenance/latest-release evidence recorded and required follow-up linked

  - title: Weekly Astrogen Paperclip operating improvement review
    owner: Chief Technical Officer
    status: active
    triggerEnabled: true
    cron: "30 12 * * 3"
    timezone: Europe/Kiev
    concurrencyPolicy: coalesce_if_active
    catchUpPolicy: skip_missed
    workflow: paperclip_operating_self_improvement
    activationGate: active; backup/email gate required before any mutation
    processContract:
      purpose:
        - learn from the previous Wednesday-Tuesday operating week
        - improve Astrogen Paperclip agents, contracts, workflows, routines, plugins, and recovery paths
        - keep CEO/CMO focused on direction while CTO owns Paperclip operating-system quality
      inputs:
        - failed, cancelled, stranded, retried, blocked, and long-running heartbeat/routine runs
        - recovery issues and manual operator repairs
        - agent AGENTS.md/contracts, workflow manifests, routine descriptions, plugin settings, and cost/accounting signals
        - owner feedback from issue comments, email, Telegram writeback, or manual notes
      decisionPolicy:
        - prefer process and contract fixes before adding more routines
        - distinguish agent behavior problems from plugin/runtime/config problems
        - optimize primarily for reliability, bounded context, clear artifacts, and recovery paths
        - route business-priority choices to CEO/CMO instead of deciding them in CTO review
      mutationGate:
        - read-only analysis may run without backup
        - any live instruction, workflow, routine, plugin, scheduler, manifest, or runtime config change requires a fresh successful DB backup first
        - backup path must be recorded in the issue and owner email
        - if backup fails, do not mutate and create a CTO blocker
        - if email delivery is unavailable, do not apply optional changes and create a CTO blocker to repair reporting
      allowedSideEffects:
        - update agent/routine/process contracts when backup and verification pass
        - tighten validation gates, output caps, recovery classifications, and routing rules
        - create bounded child issues for code/plugin/runtime work
        - send email-change-report-send through paperclip.email-notifications with concrete recipients, what changed, why, backup path, verification, follow-ups, and rollback note
      forbidden:
        - silently change production behavior without backup and email report
        - publish CMS content
        - enable Telegram proactive watches
        - call paid providers
        - edit Roger/Hermes config unless a separate owner-approved issue explicitly scopes it
        - create broad refactors or open-ended research loops
      completionGate: improvement report created, changes backed up/verified/emailed when applied, and follow-up issues routed

policy:
  noAlwaysEnqueue: true
  noMissedCatchupExceptBoundedArticleCadence: true
  activation: manual after smoke only
