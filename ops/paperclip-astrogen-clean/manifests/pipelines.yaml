      - targetUrl
      - delegatedCaseId
      - delegationProof
      - verificationProof
      - measurementBaseline
      - measurementWindow
      - measurementResult
      - nextReviewAt
      - selectionRank
      - cmsCoverageEvidence
    stages:
      - key: discovered
        name: Discovered
        kind: working
        position: 100
        config:
          transitionFieldRequirements:
            - toStageKey: evidence_ready
              requiredFields: [intentClusterKey, clusterDedupeKey, queryFamilyFingerprint, primaryQuery, supportingQueries, sourceSemanticCandidateIds, sourceClusterIds, portfolioLane]
      - { key: evidence_ready, name: Evidence Ready, kind: working, position: 200 }
      - key: ownership_review
        name: Ownership Review
        kind: review
        position: 300
        config:
          transitionFieldRequirements:
            - toStageKey: action_selected
              whenCaseField: contentPortfolioTrack
              whenCaseFieldEquals: western_astrology_learning
              requiredFields: [curriculumNodeId, curriculumRole, primaryConceptKey, primaryConceptLabelUk, introducedConceptKeys, prerequisiteNodeIds, nextNodeIds, excludedFutureConceptKeys, distinctTeachingContribution, internalLinkPlan]
              requiredArrayLengths: { introducedConceptKeys: 1 }
              singleItemArrayMatchesField: { introducedConceptKeys: primaryConceptKey }
      - key: action_selected
        name: Action Selected
        kind: working
        position: 400
        config:
          transitionFieldRequirements:
            - toStageKey: delegated
              whenCaseField: contentPortfolioTrack
              whenCaseFieldEquals: western_astrology_learning
              requiredFields: [curriculumNodeId, curriculumRole, primaryConceptKey, primaryConceptLabelUk, introducedConceptKeys, prerequisiteNodeIds, nextNodeIds, excludedFutureConceptKeys, distinctTeachingContribution, internalLinkPlan]
              requiredArrayLengths: { introducedConceptKeys: 1 }
              singleItemArrayMatchesField: { introducedConceptKeys: primaryConceptKey }
            - toStageKey: delegated
              whenCaseField: clusterLane
              whenCaseFieldEquals: compatibility_reference
              requiredFields: [allocationFamily, contentPortfolioTrack, portfolioLane]
              requiredFieldValues: { allocationFamily: zodiac_compatibility, contentPortfolioTrack: audience_applied_questions, portfolioLane: search_demand_core }
      - key: delegated
        name: Delegated
        kind: working
        position: 500
        config:
          breakdown:
            targetPipelineKey: astrogen-topic-inventory
            targetStageKey: candidate
            pieceNoun: topic
            caseKeyPrefix: topic
            carryOverPolicy:
              version: 1
              mode: only
              includeFields:
                - searchOpportunityCaseId
                - opportunityFingerprint
                - intentClusterKey
                - clusterDedupeKey
                - queryFamilyFingerprint
                - supportingQueries
                - sourceSemanticCandidateIds
                - sourceClusterIds
                - portfolioLane
                - contentPortfolioTrack
                - clusterLane
                - allocationFamily
                - curriculumNodeId
                - curriculumRole
                - primaryConceptKey
                - primaryConceptLabelUk
                - introducedConceptKeys
                - prerequisiteNodeIds
                - nextNodeIds
                - prerequisiteArticleUrls
                - excludedFutureConceptKeys
                - distinctTeachingContribution
                - selectedAction
                - topicKey
                - titleUk
                - fingerprint
                - queryCluster
                - intent
                - ctaRoute
                - evidenceRefs
                - evidenceFreshAt
                - duplicateVerdict
                - semanticOpportunityId
                - semanticClusterId
                - geoSearchVolume
                - frequencySource
                - currentOwnerUrl
                - ownershipVerdict
                - internalLinkPlan
                - primaryAudienceSegmentId
                - secondaryAudienceSegmentIds
                - trendReportRunId
              excludeFields: []
            inheritFields:
              - searchOpportunityCaseId
              - opportunityFingerprint
              - intentClusterKey
              - clusterDedupeKey
              - queryFamilyFingerprint
              - supportingQueries
              - sourceSemanticCandidateIds
              - sourceClusterIds
              - portfolioLane
              - contentPortfolioTrack
              - clusterLane
              - allocationFamily
              - curriculumNodeId
              - curriculumRole
              - primaryConceptKey
              - primaryConceptLabelUk
              - introducedConceptKeys
              - prerequisiteNodeIds
              - nextNodeIds
              - prerequisiteArticleUrls
              - excludedFutureConceptKeys
              - distinctTeachingContribution
              - selectedAction
              - topicKey
              - titleUk
              - fingerprint
              - queryCluster
              - intent
              - ctaRoute
              - evidenceRefs
              - evidenceFreshAt
              - duplicateVerdict
              - semanticOpportunityId
              - semanticClusterId
              - geoSearchVolume
              - frequencySource
              - currentOwnerUrl
              - ownershipVerdict
              - internalLinkPlan
              - primaryAudienceSegmentId
              - secondaryAudienceSegmentIds
              - trendReportRunId
            waitForPieces: true
            whenFinishedMoveTo: verified
            whenCaseField: selectedAction
            whenCaseFieldEquals: new_article
      - { key: verified, name: Verified, kind: review, position: 600 }
      - { key: measured, name: Measured, kind: done, position: 900 }
      - { key: cancelled, name: Cancelled, kind: cancelled, position: 1000 }
    transitions:
      - { from: discovered, to: evidence_ready }
      - { from: discovered, to: cancelled, label: invalid or duplicate signal }
      - { from: evidence_ready, to: ownership_review }
      - { from: evidence_ready, to: discovered, label: evidence incomplete }
      - { from: evidence_ready, to: cancelled, label: no durable demand }
      - { from: ownership_review, to: action_selected, label: ownership resolved }
      - { from: ownership_review, to: evidence_ready, label: request evidence changes }
      - { from: ownership_review, to: cancelled, label: unsafe or duplicate }
      - { from: action_selected, to: delegated }
      - { from: action_selected, to: ownership_review, label: revise decision }
      - { from: action_selected, to: cancelled, label: no action }
      - { from: delegated, to: verified }
      - { from: delegated, to: action_selected, label: reroute action }
      - { from: delegated, to: cancelled, label: obsolete or unsafe }
      - { from: verified, to: measured, label: implementation verified }
      - { from: verified, to: delegated, label: request execution changes }
      - { from: verified, to: cancelled, label: implementation rejected }
      - { from: measured, to: delegated, label: outcome regressed }
    stageAutomation:
      discovered:
        owner: SEO Performance Analyst
        instructions: |
          Normalize accepted evidence at intent-cluster level under /companies/astrogen/reference/search-demand-policy.yaml. Before creating or advancing a case, group phrases that seek the same reader outcome, have the same search intent and expected owner page, and can be satisfied by one focused article. Create or reuse exactly one canonical caseKey derived from primaryAudienceSegmentId plus stable intentClusterKey; choose one primaryQuery and store variants in supportingQueries, with all source semantic candidate IDs and source cluster IDs. Never create one opportunity per phrase, provider row, validation run or trend report. If an older phrase-level case exists, merge its evidence into the canonical case and cancel/reject the duplicate lineage with canonicalOpportunityCaseId. Start from accepted semantic-core keywords or clusters with Ukraine geo frequency and rank uncovered demand before micro-demand variants. A migrated semantic snapshot with acceptedKeywords and zero clusters is valid input: group related accepted keywords by intent before ownership review, without claiming CMS coverage. GSC is query-to-page evidence and a fallback only from a completed 28-day window; fewer than 20 impressions cannot qualify a new article without accepted semantic-core frequency. A trend report is portfolio evidence only: any proposed search phrase must pass the normal semantic-core provider-validation workflow before this case may proceed as semantic demand. When the case already contains semanticLifecycleState=accepted plus semanticMaterializedRunId or semanticAcceptedRunId, treat that immutable run identity as validation proof and do not call run-layer again; only verify the stored lineage. Use GA4 only for business context, plus Payload CMS/live inventory, CrawlObserver, current trend evidence, and existing pipeline history. For every CrawlObserver session-scoped tool, first read its schema and pass the exact camelCase sessionId returned by list-sessions; never guess session_id or id. The discovered stage never writes selectedAction: action selection belongs only to CMO at action_selected. Set portfolioLane=audience_interest_editorial only for the approved audience_interest_intent lane; otherwise use search_demand_core. If a signal is an exact invalid/duplicate input or a paused calendar-date or ephemeral daily-horoscope intent, record the typed rejection reason and use the native discovered -> cancelled transition; otherwise preserve overlap evidence and advance to evidence_ready even when no_action appears likely. Record selectionRank, query-family fingerprint, and why no higher-priority uncovered semantic or broader audience-interest candidate should precede this case. Direct product binding is not mandatory. Update this same canonical case on repeat discovery. Do not create topics, articles, refreshes, or technical tasks from this stage.
      evidence_ready:
        owner: MKT Competitive Intelligence Analyst
        instructions: |
          Build a compact evidence packet: primary query and cluster, accepted semantic IDs, Ukraine geo frequency and source, selection rank, intent, current SERP shape, Astrogen coverage state, exact GSC query-to-page ownership/conflicts, current owner URL, competing URLs, freshness, and confidence. Coverage must be one of uncovered, weak_owner, covered, or conflicting. Check the full CMS/live inventory by semantic intent and ownership; an absent exact slug or a sample of newest posts is never a duplicate verdict. Store cmsCoverageEvidence. Missing semantic frequency is allowed only for the bounded GSC fallback or the fully evidenced trend_emerging fallback in /companies/astrogen/reference/search-demand-policy.yaml. A trend phrase must pass the normal semantic-core validation workflow and resolve candidate_review before it can satisfy demand evidence. Never invent trend volume: store unavailable_not_zero plus the live report run, evidence fingerprint, sources, expiry, falsifier, confidence and warnings. Missing CMS/GSC ownership evidence blocks the case. Transition to ownership_review only when an action can be chosen without guessing.
      ownership_review:
        owner: SEO Blog Content Plan Validator
        review:
          approver: SEO Blog Content Plan Validator
          approveTo: action_selected
          requestChangesTo: evidence_ready
          rejectTo: cancelled
        instructions: |
          Resolve query-to-URL ownership before new content is considered. Verify intentClusterKey represents one page-level intent and that supportingQueries are variants, not separate owner pages; request changes when phrase-level opportunities from the same cluster remain open. Check title, H1, headings, body purpose, query overlap, current rankings, internal links, and product/service ownership. Record cannibalizationRisk, ownershipVerdict, currentOwnerUrl, any pages that should be merged or repositioned, and the link-graph boundary. For portfolioLane=audience_interest_editorial, direct product/entity ownership is not required: approve only when current audience evidence, a defensible editorial bridge, SERP value gap, claim boundaries and useful internal links make Astrogen's contribution credible. Approve only when the evidence supports one bounded action family; request evidence changes when ownership is ambiguous; reject exact duplicates and unsafe opportunities.

          For contentPortfolioTrack=western_astrology_learning, inspect the approved curriculum graph as additional planning evidence. A pillar/prerequisite/deepening/example node may pass without accepted Semantic Core demand and without a classic SERP value gap when SERP analysis is complete, the node has one distinct teaching intent, no current owner or cannibalization conflict, named prerequisite and next-step links, and a concrete distinctTeachingContribution. This exception never waives ownership, safety, internal-link or Winning Structure gates.
      action_selected:
        owner: Chief Marketing Officer
        instructions: |
          Choose exactly one selectedAction value from this closed enum: new_article, refresh, merge, reposition, internal_link, technical, or no_action. Never append a reason to the enum value; store actionReasonCode, actionReasonSummary, cooldown, and nextReviewAt separately. Manage and delegate; do not perform specialist work. Reject phrase-level duplication: one intentClusterKey may have only one canonical opportunity and one topic lineage; merge supporting queries and evidence before delegation. Calendar-date topic intents paused by owner policy must select no_action with actionReasonCode=owner_policy_calendar_date_topics_paused. Trend-derived demand must remain audience-first: do not narrow it into Astrogen product, service, modality, route, existing owner URL, or product keyword-family language. If titleUk, topicKey, primary keyword, H1, slug, proposed phrase, or action reason introduces product/service/modality wording that was not present in the retained audience signal, set actionReasonCode=product_narrowing_contamination and use the native action_selected -> cancelled transition. new_article is allowed only for uncovered audience-discussion demand that passes /companies/astrogen/reference/search-demand-policy.yaml, has safe ownership, is not displaced by a higher-priority uncovered semantic-core candidate, and does not violate the repetitive-query-family batch limit. It must include stable audience-first topicKey, audience-first titleUk, fingerprint, queryCluster, intent, CTA route, accepted semantic/frequency evidence, an allowed GSC fallback, or a fully evidenced trend_emerging fallback, selectionRank, intentClusterKey, clusterDedupeKey, queryFamilyFingerprint, supportingQueries, portfolioLane, full CMS semantic-coverage evidence, duplicate verdict, an incoming/outgoing internalLinkPlan, and exactly one configured primaryAudienceSegmentId. For portfolioLane=audience_interest_editorial, no direct product/entity anchor is required, but current trend evidence, audience fit, a defensible Astrogen editorial perspective, SERP information gain, safety boundaries and useful internal links are mandatory. Secondary audience segments are optional and never count toward another portfolio quota. Trend-derived demand also requires trendReportRunId. Raw trend output never satisfies semantic acceptance or ownership evidence. For trend-derived opportunities, refresh is allowed only when the existing owner already covers the same audience discussion theme; never choose refresh merely because a product/service/modality page is related. For new_article, refresh, merge, reposition, internal_link, or technical, transition to delegated only after durable fields exist; non-article execution actions must ingest or update one stable astrogen-growth-actions case and link its ID. no_action creates no child: once its reason, cooldown, and nextReviewAt are durable, use the native action_selected -> cancelled transition and terminate this opportunity without delegated, verification, or measurement automation.

          Assign exactly one contentPortfolioTrack from the 12/5/3/3/2 policy. primaryAudienceSegmentId remains required for diversity reporting but has no hard quota. For western_astrology_learning curriculum nodes, the accepted-semantic/frequency requirement above is replaced by the typed curriculum proof defined in search-demand-policy.yaml; all ownership, cannibalization, SERP analysis, internal-link and Winning Structure requirements remain mandatory.
      delegated:
        owner: Chief Marketing Officer
        instructions: |
          Control the linked downstream case without doing specialist execution. For new_article, call native breakdown once: the server creates or reuses one guarded astrogen-topic-inventory child, waits for its terminal delivery outcome, and advances this case to verified only after that child finishes. Never create a CMS draft directly from search-demand recovery and never delegate a CMS-only shortcut: a direct draft, a cover waiver, or a narrative handoff is not article delivery. For refresh, merge, reposition, internal_link, or technical, this pipeline verifies routing, not implementation: require one linked astrogen-growth-actions case with correct actionClass, manager/executor ownership, nextReviewAt or measurementWindow, and a durable delegationProof. Do not block search-demand or topic refill while the linked growth action is still executing, externally waiting, or blocked; that state belongs to the growth-actions lane. A blocked child affects only this opportunity; classify the blocker and keep unrelated cases moving. Transition non-article actions to verified after delegation proof is durable, even when implementation evidence is still pending in the linked growth case.
      verified:
        owner: SEO Performance Analyst
        review:
          approver: SEO Performance Analyst
          approveTo: measured
          requestChangesTo: delegated
          rejectTo: cancelled
        instructions: |
          Verify the selected action at the correct ownership boundary. First inspect canonicalOpportunityCaseId and actionReasonCode: when actionReasonCode=merged_into_intent_cluster and the canonical case exists with the same intentClusterKey, reject this review to cancelled even if an older selectedAction says new_article; a merged query variant must not wait for its own CMS delivery. For canonical new_article, require the guarded topic/article chain, terminal delivered article case, authenticated CMS draft evidence, non-empty coverImage and ogImage media IDs, and CMO delivery proof. A CMS draft created outside astrogen-article-production, or any cover-image waiver, is invalid and must return to delegated for native recovery without creating another CMS draft. For refresh, merge, reposition, internal_link, or technical, verify that this search-demand opportunity has been routed to exactly one astrogen-growth-actions case with delegatedCaseId, actionClass, manager/executor ownership, nextReviewAt or measurementWindow, and a durable delegationProof; do not require before-after, CMS, redirect, rendered link, or production implementation evidence in this pipeline. Those implementation proofs are required inside astrogen-growth-actions before that linked growth case can be measured. Store verificationProof with status=delegation_verified for non-article actions and approve this search-demand case to measured when routing is verified. If the linked growth case is incorrectly measured without implementation proof, repair or reopen the linked growth case but do not keep this search-demand opportunity blocked. A fully delivered CMS draft with no publishedAt or scheduledPublishAt is a normal waiting-for-publication state, not failed execution: preserve the relevant implementation case on one bounded monitor. Generic monitorNextCheckAt/monitorNotes fields are not the writable API contract. Do not create a user interaction, owner request, publication child task, or repeated verification issue merely because a valid draft is not yet published.
    invariants:
      - every opportunity follows discovered -> evidence_ready -> ownership_review -> action_selected -> delegated -> verified -> measured
      - repeated signals update one opportunityFingerprint instead of creating duplicates
      - query-to-URL ownership is resolved before action selection
      - only selectedAction=new_article can invoke native breakdown into astrogen-topic-inventory candidate
      - topic inventory intake rejects cases without the guarded new_article parent
      - refresh, merge, reposition, internal_link and technical route to execution lanes, never topic inventory
      - no_action terminates through action_selected -> cancelled with reason, cooldown and nextReviewAt and creates no downstream work
      - broad audience demand is allowed, but every action must avoid cannibalizing an existing owner
      - trend-derived opportunities must not be narrowed into product/service/modality titles, H1s, slugs, primary keywords, topicKeys or refresh owners; product bridges are body-link context only
      - new_article requires an incoming and outgoing internal-link plan before topic validation
      - every new_article has exactly one configured primaryAudienceSegmentId; secondary segments never double-count portfolio supply
      - merge and reposition require redirect, canonical, sitemap, link migration and rollback evidence
      - verified means new_article delivery proof exists, or non-article delegation into astrogen-growth-actions is proven at the routing boundary
      - new_article delivery proof requires a terminal native article case plus authenticated CMS coverImage and ogImage; direct CMS drafts and media waivers are never valid proof
      - measured on this pipeline means the search-demand opportunity is fully classified and routed; implementation outcome measurement belongs to the linked execution pipeline
      - a valid unpublished CMS draft waits in verified on one bounded monitor and never loops through delegated
      - one blocked opportunity never freezes unrelated safe work

  - key: astrogen-topic-inventory
    name: Astrogen Topic Inventory
    description: Transactional lifecycle for evidence-backed article ideas and reservations.
    enforceTransitions: true
    readyLowWaterMark: 25
    readyTarget: 25
    portfolioTrackTargets:
      western_astrology_learning: 12
      audience_applied_questions: 5
      audience_trends: 3
      trust_expert_method_boundaries: 3
      commercial_unmet_demand: 2
    caseKey: topic:<topicKey>
    requiredFields:
      - searchOpportunityCaseId
      - selectedAction
      - topicKey
      - titleUk
      - fingerprint
      - queryCluster
      - intent
      - ctaRoute
      - evidenceRefs
      - evidenceFreshAt
      - duplicateVerdict
      - reservationExpiresAt
      - consumingArticleCaseId
      - primaryAudienceSegmentId
      - secondaryAudienceSegmentIds
      - trendReportRunId
      - intentClusterKey
      - clusterDedupeKey
      - queryFamilyFingerprint
      - supportingQueries
      - portfolioLane
      - contentPortfolioTrack
    stages:
      - key: candidate
        name: Candidate
        kind: working
        position: 100
        config:
          intakeGuard:
            requiredParentPipelineKey: astrogen-search-demand-opportunities
            requiredParentStageKeys: [delegated]
            requiredParentCaseField: selectedAction
            requiredParentCaseFieldEquals: new_article
          transitionFieldRequirements:
            - toStageKey: evidence_ready
              whenCaseField: contentPortfolioTrack
              whenCaseFieldEquals: western_astrology_learning
              requiredFields: [curriculumNodeId, curriculumRole, primaryConceptKey, primaryConceptLabelUk, introducedConceptKeys, prerequisiteNodeIds, nextNodeIds, excludedFutureConceptKeys, distinctTeachingContribution, internalLinkPlan]
              requiredArrayLengths: { introducedConceptKeys: 1 }
              singleItemArrayMatchesField: { introducedConceptKeys: primaryConceptKey }
            - toStageKey: evidence_ready
              whenCaseField: clusterLane
              whenCaseFieldEquals: compatibility_reference
              requiredFields: [allocationFamily, contentPortfolioTrack, portfolioLane, pageKeywordPacket, contentRole, demandClass, cooldownNotes, semanticAcceptedRunId]
              requiredFieldValues: { allocationFamily: zodiac_compatibility, contentPortfolioTrack: audience_applied_questions, portfolioLane: search_demand_core }
      - key: evidence_ready
        name: Evidence Ready
        kind: working
        position: 200
        config:
          transitionFieldRequirements:
            - toStageKey: ready
              whenCaseField: contentPortfolioTrack
              whenCaseFieldEquals: western_astrology_learning
              requiredFields: [curriculumNodeId, curriculumRole, primaryConceptKey, primaryConceptLabelUk, introducedConceptKeys, prerequisiteNodeIds, nextNodeIds, prerequisiteArticleUrls, excludedFutureConceptKeys, distinctTeachingContribution, internalLinkPlan]
              requiredArrayLengths: { introducedConceptKeys: 1 }
              singleItemArrayMatchesField: { introducedConceptKeys: primaryConceptKey }
            - toStageKey: ready
              whenCaseField: clusterLane
              whenCaseFieldEquals: compatibility_reference
              requiredFields: [allocationFamily, contentPortfolioTrack, portfolioLane, pageKeywordPacket, contentRole, demandClass, cooldownNotes, semanticAcceptedRunId]
              requiredFieldValues: { allocationFamily: zodiac_compatibility, contentPortfolioTrack: audience_applied_questions, portfolioLane: search_demand_core }
      - key: ready
        name: Ready For Brief
        kind: working
        position: 300
        config:
          breakdown:
            targetPipelineKey: astrogen-article-production
            targetStageKey: opportunity
            pieceNoun: article
            caseKeyPrefix: article
            carryOverPolicy:
              version: 1
              mode: only
              includeFields:
                - topicKey
                - titleUk
                - ctaRoute
                - evidenceRefs
                - intentClusterKey
                - clusterDedupeKey
                - queryFamilyFingerprint
                - supportingQueries
                - portfolioLane
                - contentPortfolioTrack
                - clusterLane
                - allocationFamily
                - curriculumNodeId
                - curriculumRole
                - primaryConceptKey
                - primaryConceptLabelUk
                - introducedConceptKeys
                - prerequisiteNodeIds
                - nextNodeIds
                - prerequisiteArticleUrls
                - excludedFutureConceptKeys
                - distinctTeachingContribution
              excludeFields: []
            inheritFields:
              - topicKey
              - titleUk
              - ctaRoute
              - evidenceRefs
              - intentClusterKey
              - clusterDedupeKey
              - queryFamilyFingerprint
              - supportingQueries
              - portfolioLane
              - contentPortfolioTrack
              - clusterLane
              - allocationFamily
              - curriculumNodeId
              - curriculumRole
              - primaryConceptKey
              - primaryConceptLabelUk
              - introducedConceptKeys
              - prerequisiteNodeIds
              - nextNodeIds
              - prerequisiteArticleUrls
              - excludedFutureConceptKeys
              - distinctTeachingContribution
            advanceTo: reserved
            waitForPieces: true
            whenFinishedMoveTo: ready
            whenCaseField: selectedAction
            whenCaseFieldEquals: new_article
      - key: reserved
        name: Reserved
        kind: working
        position: 400
        config:
          requireChildrenTerminal: true
          childrenTerminalOutcome:
            allDoneToStageKey: consumed
            anyCancelledToStageKey: ready
            requireCurrentDirectChild: true
            childCaseIdField: consumingArticleCaseId
            proofField: consumingArticleProof
      - { key: consumed, name: Consumed, kind: done, position: 900 }
      - { key: rejected_duplicate, name: Rejected Duplicate, kind: cancelled, position: 1000 }
      - { key: needs_owner_direction, name: Needs Owner Direction, kind: review, position: 1100 }
      - { key: waiting_evidence, name: Waiting Evidence, kind: working, position: 1200 }
      - { key: expired, name: Expired, kind: cancelled, position: 1300 }
    transitions:
      - { from: candidate, to: evidence_ready }
      - { from: candidate, to: waiting_evidence }
      - { from: evidence_ready, to: ready }
      - { from: evidence_ready, to: rejected_duplicate }
      - { from: evidence_ready, to: needs_owner_direction }
      - { from: evidence_ready, to: waiting_evidence }
      - { from: waiting_evidence, to: evidence_ready }
      - { from: waiting_evidence, to: expired, label: bounded evidence source has no matching coverage }
      - { from: ready, to: reserved }
      - { from: ready, to: rejected_duplicate, label: terminal child proved existing duplicate }
      - { from: ready, to: waiting_evidence, label: required evidence became incomplete or invalid }
      - { from: reserved, to: consumed }
      - { from: reserved, to: ready, label: lease expired }
      - { from: reserved, to: rejected_duplicate, label: child proved existing duplicate }
      - { from: candidate, to: expired }
      - { from: ready, to: expired }
      - { from: needs_owner_direction, to: ready, label: approved }
      - { from: needs_owner_direction, to: rejected_duplicate, label: rejected }
    stageAutomation:
      candidate:
        owner: SEO Blog Content Strategist
        instructions: |
          Accept only the guarded new_article child of astrogen-search-demand-opportunities. Preserve searchOpportunityCaseId, semantic IDs, frequency source, ownership verdict, intentClusterKey, clusterDedupeKey, query-family fingerprint, supportingQueries, portfolioLane, contentPortfolioTrack, clusterLane, allocationFamily, internal-link plan, trendReportRunId, and exactly one configured primaryAudienceSegmentId for diversity reporting. For clusterLane=compatibility_reference, require allocationFamily=zodiac_compatibility, contentPortfolioTrack=audience_applied_questions, portfolioLane=search_demand_core, and the canonical fields pageKeywordPacket, contentRole, demandClass, cooldownNotes, and semanticAcceptedRunId. Do not write packet aliases such as acceptedPageKeywordPacket or finalPageKeywordPacket. For western_astrology_learning, copy the canonical curriculum node and require exactly one introduced concept equal to primaryConceptKey; aliases remain one concept, while adjacent definitions, catalogues and untaught interpretation steps are forbidden. Query native topic inventory before advancing: when another nonterminal topic already owns the same intentClusterKey, merge evidence into that canonical topic and reject or expire this duplicate child. Each topic counts once toward exactly one contentPortfolioTrack target; audience segments have no hard quota and must never cause filler. Expire any calendar-date or ephemeral daily-horoscope topic paused by /companies/astrogen/reference/search-demand-policy.yaml even when a legacy parent selected new_article. For trend-derived parents, expire any candidate whose titleUk, topicKey, primary keyword, H1 or slug narrows an audience trend into Astrogen product/service/modality language; set rejectionReason=product_narrowing_contamination. Enrich the candidate without reopening the action decision, update typed case fields, and transition to evidence_ready, waiting_evidence, or expired. Do not create article work yet.
      evidence_ready:
        owner: SEO Blog Content Plan Validator
        instructions: |
          Validate demand or an approved western-astrology curriculum prerequisite, one page-level intentClusterKey, business fit, duplicate/cannibalization risk, CTA route, evidence freshness, one primaryAudienceSegmentId for diversity reporting, exactly one contentPortfolioTrack, trend lineage when applicable, portfolioLane, clusterLane/allocationFamily when applicable, and incoming/outgoing internal links. Reject duplicate topic lineages for the same intentClusterKey even when primaryQuery wording differs. For clusterLane=compatibility_reference, require allocationFamily=zodiac_compatibility, contentPortfolioTrack=audience_applied_questions, portfolioLane=search_demand_core, and the canonical fields pageKeywordPacket, contentRole, demandClass, cooldownNotes, and semanticAcceptedRunId; aliases do not satisfy the gate. For contentPortfolioTrack=western_astrology_learning, use /companies/astrogen/reference/western-astrology-curriculum.yaml. Semantic Core demand is not mandatory for an approved missing node, but require exactly one primaryConceptKey and one matching introducedConceptKeys item, a distinct teaching intent, no current owner, no cannibalization, published prerequisite URLs for every dependency, excluded future concepts, SERP analysis and a Winning Structure value plan. A missing classic SERP value gap alone does not reject that prerequisite; more than one new concept or an unavailable prerequisite does. For portfolioLane=audience_interest_editorial, require the bounded monthly lane policy, current signal, defensible editorial bridge, SERP information gain and claim boundaries; direct product binding is not required. For trend-derived topics, reject product_narrowing_contamination before ready. Transition to ready only with complete safe fields; return a ready case to waiting_evidence if required evidence later proves incomplete. Otherwise use rejected_duplicate, needs_owner_direction, or waiting_evidence with a durable reason.
      reserved:
        owner: Chief Marketing Officer
        instructions: |
          Verify the current child article case returned by native breakdown exists and remains live. Set consumingArticleCaseId to that current reservation child whenever it differs from the stored value; a released topic may retain proof of an older cancelled child. Keep this topic reserved while the current article is active. Native children-terminal outcomes atomically move it to consumed after delivery or release it to ready after cancellation and store consumingArticleProof; do not perform those terminal transitions manually. Return it to ready manually only when the lease expires and no live article case exists. Do not create or duplicate the article case.
      needs_owner_direction:
        owner: Chief Marketing Officer
        review:
          approver: Chief Marketing Officer
          approveTo: ready
          rejectTo: rejected_duplicate
        instructions: |
          Resolve only a real business/editorial direction decision. Approve to ready with a concrete rationale or reject with durable evidence. Technical evidence gaps belong in waiting_evidence and must not be sent to the owner as a business choice.
      waiting_evidence:
        owner: SEO Blog Content Strategist
        instructions: |
          Recheck only the missing evidence named on this case. For Semantic Core MCP calls use only project_id=astrogen-ukraine; never probe guessed project variants. Use one bounded retry or an explicit monitor date. Transition back to evidence_ready when complete. If the configured evidence source responds successfully but has no matching query/segment coverage, or another topic from the same repetitive family already occupies the current batch, record the durable no-coverage/portfolio proof and transition this candidate to expired so one candidate cannot block the canonical refill. A new source fingerprint may be rediscovered later. Retain a typed technical blocker only for a transient provider/runtime failure with a concrete nextReviewAt; never create duplicate topic or configuration cases.
    invariants:
      - reserve atomically by topicKey and lease
      - ready topics are dispatched only by the scheduled CMO allocator through native breakdown
      - a delivered article atomically consumes its still-reserved topic and stores terminal child proof
      - a cancelled article atomically releases its still-reserved topic to ready and stores terminal child proof
      - a child cancelled for a proven existing-content duplicate rejects the topic instead of releasing it for reallocation
      - refill while ready plus reserved eligible supply is below 25 or any contentPortfolioTrack is below its 12/5/3/3/2 target
      - no-safe-topic triggers refill and never completes article cadence by itself
      - repeated evidence updates the same fingerprint
      - candidate intake requires a parent astrogen-search-demand-opportunities case at delegated with selectedAction=new_article
      - ready breakdown requires selectedAction=new_article; legacy ready cases without guarded opportunity lineage are ineligible and expire
      - agents and weekly routines never ingest topic candidates directly
      - one topic counts once under exactly one contentPortfolioTrack; audience segments are diversity metadata, not hard quotas
      - one intentClusterKey has one canonical nonterminal topic lineage; supporting query variants never count as separate topics
      - western_astrology_learning topics cannot reach ready without one curriculum node, one primary concept, exactly one introduced concept, and published prerequisite links
      - audience_interest_editorial production is capped at four Europe/Kiev calendar-month articles and one per daily batch
      - allocationFamily=zodiac_compatibility is capped at one article per Europe/Kiev daily allocator batch while its page-level query families remain distinct

  - key: astrogen-growth-actions
    name: Astrogen Growth Actions
    description: Execution lifecycle for weekly SEO, GEO, conversion, and technical growth findings.
    enforceTransitions: true
    caseKey: growth:<findingFingerprint>
    requiredFields:
      - findingFingerprint
      - actionClass
      - businessOutcome
      - evidenceRefs
      - managerId
      - executorId
      - blockerClass
      - nextReviewAt
      - completionProof
      - measurementWindow
    stages:
      - { key: finding, name: Finding, kind: working, position: 100 }
      - { key: portfolio_review, name: Portfolio Review, kind: review, position: 200 }
      - { key: delegated, name: Delegated, kind: working, position: 300 }
      - { key: executing, name: Executing, kind: working, position: 400 }
      - key: verify
        name: Verify Outcome
        kind: review
        position: 500
        config:
          pipelineStageCountRequirements:
            - toStageKey: measured
              pipelineKey: astrogen-topic-inventory
              stageKey: ready
              additionalStageKeys: [reserved]
              minimumCount: 25
              groupByField: contentPortfolioTrack
              requiredGroupValues: [western_astrology_learning, audience_applied_questions, audience_trends, trust_expert_method_boundaries, commercial_unmet_demand]
