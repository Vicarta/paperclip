version: 1
company: Astrogen
project: Astrogen Growth OS
mode: active

pipelines:
  - key: astrogen-article-production
    name: Astrogen Article Production
    description: Evidence-backed draft-only article delivery from validated opportunity through one durable Winning Structure run to owner-notified CMS draft.
    enforceTransitions: true
    productiveWipCap: 3
    caseKey: article:<topicKey>
    stageMigrations:
      serp_check: strategy_input
    requiredFields:
      - operation
      - topicKey
      - titleUk
      - targetQueryCluster
      - ctaRoute
      - evidenceRefs
      - taskRevision
      - winningStructureNamespace
      - winningStructureIdempotencyKey
      - winningStructureInputDocumentId
      - winningStructureRunId
      - winningStructureInputHash
      - winningStructureEffectiveInputHash
      - winningStructureDecisionSetVersion
      - winningStructureStatus
      - winningStructureGistEnabled
      - winningStructureRetentionExpiresAt
      - winningStructureResultDocumentId
      - winningStructureContentSelectionAuditDocumentId
      - winningStructureMetaEvidenceBriefDocumentId
      - winningStructureProviderProvenanceDocumentId
      - winningStructureCostDocumentId
      - winningStructureCostEstimationStatus
      - winningStructureOverlayDocumentId
      - structureMappingStatus
      - contentQualityRequirementsSummary
      - publicationRequirementsSummary
      - articleType
      - selectedValueUnitIds
      - valueEvidenceRefs
      - valueCommitmentRefs
      - geoRetrievabilityRequired
      - mcQualityOutcome
      - mcQualitySurfaceRevisionCount
      - mcQualitySubstantiveRevisionCount
      - blockerClass
      - nextReviewAt
      - attemptCount
      - cmsDraftId
      - cmsAdminUrl
      - telegramMessageId
    stages:
      - key: opportunity
        name: Opportunity
        kind: working
        position: 100
        config:
          transitionFieldRequirements:
            - toStageKey: strategy_input
              whenCaseField: contentPortfolioTrack
              whenCaseFieldEquals: western_astrology_learning
              requiredFields: [curriculumNodeId, curriculumRole, primaryConceptKey, primaryConceptLabelUk, introducedConceptKeys, prerequisiteNodeIds, excludedFutureConceptKeys, distinctTeachingContribution]
              requiredArrayLengths: { introducedConceptKeys: 1 }
              singleItemArrayMatchesField: { introducedConceptKeys: primaryConceptKey }
      - { key: strategy_input, name: Strategy Input, kind: working, position: 200 }
      - { key: winning_structure, name: Winning Structure, kind: working, position: 300 }
      - { key: structure_decision, name: Structure Decision, kind: working, position: 400 }
      - key: structure_review
        name: Structure Review
        kind: review
        position: 500
        config:
          transitionFieldRequirements:
            - toStageKey: brief
              whenCaseField: contentPortfolioTrack
              whenCaseFieldEquals: western_astrology_learning
              requiredFields: [curriculumStructureStatus, primaryConceptKey, introducedConceptKeys]
              requiredArrayLengths: { introducedConceptKeys: 1 }
              requiredFieldValues: { curriculumStructureStatus: passed }
              singleItemArrayMatchesField: { introducedConceptKeys: primaryConceptKey }
      - key: brief
        name: Brief
        kind: working
        position: 600
        config:
          transitionFieldRequirements:
            - toStageKey: draft
              whenCaseField: contentPortfolioTrack
              whenCaseFieldEquals: western_astrology_learning
              requiredFields: [curriculumBriefStatus, primaryConceptKey, introducedConceptKeys, prerequisiteArticleUrls, excludedFutureConceptKeys]
              requiredArrayLengths: { introducedConceptKeys: 1 }
              requiredFieldValues: { curriculumBriefStatus: passed }
              singleItemArrayMatchesField: { introducedConceptKeys: primaryConceptKey }
      - key: draft
        name: Claude Draft
        kind: working
        position: 700
        config:
          inlineContextDocumentKeys: [writer-brief]
          inlineContextMaxChars: 48000
          inlineContextRequireComplete: true
      - key: validate
        name: Content Validation
        kind: review
        position: 800
        config:
          transitionFieldRequirements:
            - toStageKey: humanize
              whenCaseField: contentPortfolioTrack
              whenCaseFieldEquals: western_astrology_learning
              requiredFields: [curriculumValidationStatus, supportingTerminologyValidationStatus, primaryConceptKey, detectedNewConceptKeys]
              requiredArrayLengths: { detectedNewConceptKeys: 1 }
              requiredFieldValues: { curriculumValidationStatus: passed, supportingTerminologyValidationStatus: passed }
              singleItemArrayMatchesField: { detectedNewConceptKeys: primaryConceptKey }
      - { key: humanize, name: Humanize, kind: working, position: 900 }
      - key: mc_quality
        name: Main Content Quality
        kind: working
        position: 1000
        config:
          transitionFieldRequirements:
            - toStageKey: layout
              whenCaseField: contentPortfolioTrack
              whenCaseFieldEquals: western_astrology_learning
              requiredFields: [curriculumMcQualityStatus, supportingTerminologyMcStatus, primaryConceptKey, mcDetectedNewConceptKeys]
              requiredArrayLengths: { mcDetectedNewConceptKeys: 1 }
              requiredFieldValues: { curriculumMcQualityStatus: passed, supportingTerminologyMcStatus: passed }
              singleItemArrayMatchesField: { mcDetectedNewConceptKeys: primaryConceptKey }
      - { key: layout, name: Layout, kind: working, position: 1100 }
      - { key: layout_validate, name: Layout Validation, kind: review, position: 1200 }
      - key: image
        name: Cover Image
        kind: working
        position: 1300
        config:
          reviewSafeFieldPrefixes: [image, coverImage, coverMedia, ogImage, blocker]
          reviewSafeFieldKeys: [coverMediaId, ogImageMediaId, attemptCount, blockerClass, nextReviewAt]
      - key: image_recovery_review
        name: Cover Image Recovery Review
        kind: working
        position: 1350
        config:
          reviewSafeFieldPrefixes: [image, coverImage, coverMedia, ogImage]
          reviewSafeFieldKeys: [coverImageRetryAuthorizationCount, coverImageRetryAuthorizedAt, attemptCount, blockerClass, nextReviewAt]
      - key: cms_draft
        name: CMS Draft
        kind: working
        position: 1400
        config:
          # The CMS adapter writes only draft IDs, relations and verified delivery
          # metadata here. Reviewed editorial content remains in its own documents.
          reviewSafeFieldPrefixes: [cms, beforeAfterDiff, coverMedia, ogImage, blocker]
          reviewSafeFieldKeys: [cmsAdminUrl, attemptCount, blockerClass, nextReviewAt]
          transitionFieldRequirements:
            - toStageKey: cmo_delivery
              requiredFields: [cmsAdminUrl]
              requiredStringPrefixes: { cmsAdminUrl: "https://cms.astrogen.com.ua/admin/collections/blogPosts/" }
            - toStageKey: cmo_delivery
              whenCaseField: contentPortfolioTrack
              whenCaseFieldEquals: western_astrology_learning
              requiredFields: [curriculumDeliveryStatus, supportingTerminologyDeliveryStatus, primaryConceptKey, cmsDraftId, cmsAdminUrl]
              requiredFieldValues: { curriculumDeliveryStatus: passed, supportingTerminologyDeliveryStatus: passed }
      - key: cmo_delivery
        name: CMO Delivery
        kind: review
        position: 1500
        config:
          # These are delivery receipts and CMS verification metadata. They cannot
          # alter the reviewed article body, title, brief, or Winning Structure input.
          reviewSafeFieldPrefixes: [cms, delivery, cmoDelivery, telegram, topicReservation, blocker]
          reviewSafeFieldKeys: [telegramMessageId, telegramDeliveryOk, blockerClass, nextReviewAt, attemptCount]
          transitionFieldRequirements:
            - toStageKey: delivered
              requiredFields: [cmsAdminUrl]
              requiredStringPrefixes: { cmsAdminUrl: "https://cms.astrogen.com.ua/admin/collections/blogPosts/" }
            - toStageKey: delivered
              whenCaseField: contentPortfolioTrack
              whenCaseFieldEquals: western_astrology_learning
              requiredFields: [curriculumDeliveryStatus, curriculumFinalReviewStatus, supportingTerminologyFinalReviewStatus, primaryConceptKey, telegramMessageId]
              requiredFieldValues: { curriculumDeliveryStatus: passed, curriculumFinalReviewStatus: passed, supportingTerminologyFinalReviewStatus: passed }
      - { key: delivered, name: Delivered, kind: done, position: 1600 }
      - { key: cancelled, name: Cancelled, kind: cancelled, position: 1700 }
    transitions:
      - { from: opportunity, to: strategy_input }
      - { from: strategy_input, to: winning_structure }
      - { from: winning_structure, to: strategy_input, label: proven pre-start payload repair }
      - { from: winning_structure, to: structure_decision, label: decision required }
      - { from: winning_structure, to: structure_review, label: completed and imported }
      - { from: structure_decision, to: winning_structure, label: authorized decision submitted }
      - { from: structure_review, to: winning_structure, label: re-import or verify same run }
      - { from: structure_review, to: strategy_input, label: explicitly authorized new revision }
      - { from: structure_review, to: brief, label: approved }
      - { from: brief, to: draft }
      - { from: draft, to: validate }
      - { from: validate, to: humanize, label: approved }
      - { from: validate, to: draft, label: request changes }
      - { from: validate, to: cancelled, label: rejected }
      - { from: humanize, to: mc_quality }
      - { from: mc_quality, to: layout, label: pass }
      - { from: mc_quality, to: humanize, label: revise_surface }
      - { from: mc_quality, to: draft, label: revise_substantive }
      - { from: mc_quality, to: cancelled, label: reject_unsafe }
      - { from: layout, to: layout_validate }
      - { from: layout_validate, to: image, label: approved }
      - { from: layout_validate, to: layout, label: request changes }
      - { from: layout_validate, to: cancelled, label: rejected }
      - { from: image, to: cms_draft }
      - { from: image, to: image_recovery_review, label: hard_visual_qa_failure }
      - { from: image_recovery_review, to: image, label: authorize_one_corrective_retry }
      - { from: image_recovery_review, to: cms_draft, label: accept_existing_after_visual_review }
      - { from: image_recovery_review, to: cancelled, label: reject_cover_recovery }
      - { from: cms_draft, to: cmo_delivery }
      - { from: cmo_delivery, to: delivered }
      - { from: opportunity, to: cancelled }
      - { from: strategy_input, to: cancelled }
      - { from: winning_structure, to: cancelled }
      - { from: structure_decision, to: cancelled, label: authorized cancel }
      - { from: structure_review, to: cancelled, label: rejected }
      - { from: brief, to: cancelled }
      - { from: draft, to: cancelled }
      - { from: humanize, to: cancelled }
      - { from: layout, to: cancelled }
      - { from: image, to: cancelled }
      - { from: cms_draft, to: cancelled }
      - { from: cmo_delivery, to: cancelled }
    stageAutomation:
      opportunity:
        owner: Chief Marketing Officer
        instructions: |
          Act as article portfolio manager, not a specialist executor. Validate the case topicKey against accepted topic inventory and current duplicate/cannibalization evidence, set one stable taskRevision for this logical request, and reserve only this case. For contentPortfolioTrack=western_astrology_learning, require lineage from /companies/astrogen/reference/western-astrology-curriculum.yaml with one primaryConceptKey and exactly one matching introducedConceptKeys item; reject or return malformed legacy curriculum work before Winning Structure. Always transition to strategy_input only after the native gate passes; old SERP evidence may support the payload but never bypasses Winning Structure. Never write the article, generate an image, mutate CMS, or send Telegram in this stage.
      strategy_input:
        owner: SEO Blog Content Strategist
        instructions: |
          Build one complete Winning Structure payload from the matching CMS page snapshot when operation=refresh, semantic-core cluster, GSC/GA4 query-to-URL evidence, ownership inventory, CTA/product bridge routes, editorial constraints, and verified first-party reader-value evidence or publication-blocking commitments. Classify exactly one articleType under /companies/astrogen/reference/article-value-system.yaml and propose 2-4 type-appropriate value units by reader problem, evidence availability, and sibling differentiation. Each selected value unit is invalid unless it has valueUnitId, generator, readerProblem, contribution, claimBoundaries, siblingDifferentiationFingerprint, evidenceRefsOrCommitmentRefs, acceptanceCriteria, and 1-4 canonical targetIntentCovered values from that reference. Do not write targetSectionIds: remote section IDs do not exist at strategy-input time. If this typed strategy input is incomplete, repair it in this stage; do not start an MCP run and do not hand a malformed unit to Winning Structure.

          For contentPortfolioTrack=western_astrology_learning, read the canonical curriculum node before building the payload. Lock exactly one primary concept and put the one-concept rule, published prerequisite URLs, plain-language substitution rule, and excluded future concepts into editorial_constraints and business_context. Two to four value units may deepen the same primary concept, but they may not introduce adjacent astrology terms, a glossary, a twelve-item catalogue, or an interpretation method that depends on untaught concepts. At most one explicitly curriculum-approved supporting term may appear when accurate explanation requires it; record its term, one-sentence plain-language definition, first-use section, and necessity in supportingTermGlossary, and forbid any separate section, table, list, FAQ, comparison, example set, or workflow for it. Set introducedConceptKeys to exactly [primaryConceptKey].

          Persist a case document with key winning-structure-input whose body is one JSON object that can be passed unchanged to both validate_task_input and start_winning_structure_run. Its top-level fields are company_id, project_id, client_key=astrogen-ukraine, idempotency_key=winning-structure:{articleCaseId}:{taskRevision}, task, market, gist_enabled=true, cache_policy, cost_policy, editorial_constraints, and optional current_page_snapshot, business_context, ownership_context, and reader_value_policy. Build cost_policy from /companies/astrogen/reference/winning-structure-policy.yaml as currency, operation_rates_usd=operationRatesUsd, pricing_source=pricingSource, and pricing_version=pricingVersion; include only priced operations and never invent a rate for an intentionally unpriced operation. GIST is enabled for the normal single production run. A baseline comparison is forbidden unless a separately authorized canary has a distinct taskRevision and idempotency key; the MCP never chooses the winner. The task object must contain page_mode, target_url, primary_keyword, auxiliary_keywords, intent_hypothesis, and content_goal; keyword_cluster_id is optional. page_mode is exactly existing for refresh/repair of a CMS draft and new only for a page that does not exist. editorial_constraints is always a list of strings, never an object. The allowed reader_value_evidence.evidence_type values and manual_value_commitments.asset_type values are exactly those in taskInputContract under /companies/astrogen/reference/winning-structure-policy.yaml; map a local source to the nearest truthful allowed type and never mint a custom enum. The market object must contain geo=UA, search_language=uk, output_language=uk-UA, and primary_device. Put all reader_value_evidence, manual_value_commitments, product_bridge_targets, and other business fields inside one business_context object. Every reader_value_evidence entry must contain evidence_id, evidence_type, title, summary, reader_problem, and source; optional claim_boundaries, artifact_refs, observed_at, and rights_and_privacy_notes must retain their original evidence meaning. Every manual_value_commitments entry must contain commitment_id, asset_type, description, reader_problem, value_proposition, owner, target_content_units, validation_method, acceptance_criteria, and due_before_publication=true. Every product_bridge_targets entry must contain url and a human-facing label; optional type, bridge_type, placement_after_section, and instruction are allowed. Never use legacy aliases ref, route, relationship, bridge_role, claim_boundary, owner_role, commitment_type, reader_facing_asset, or verification_before_delivery in the MCP payload. Never emit task_input, namespace, run_id, decisions, validation results, internal wrapper metadata, or a Markdown fence in this document. Persist winningStructureInputDocumentId=winning-structure-input, winningStructureNamespace with the same company_id/project_id/client_key, winningStructureGistEnabled=true, evidence/commitment refs, geoRetrievabilityRequired, and warnings.

          When existing non-SERP evidence is insufficient, create only a valid commitmentFallbackPolicy commitment for a concrete reader-facing asset that an assigned pipeline role can produce and the validator can verify before CMS delivery; data/tool access, semantic-core collection, ownership research, generic SEO improvement, or adding a layout block is never a reader-value commitment. Leave winningStructureRunId, winningStructureStatus, both input hashes, decision version, retention expiry, and result document ID null: only the winning_structure stage may populate them from actual plugin responses. Never write a heartbeat/session/issue ID into an MCP field. If operation=create is proven to duplicate an existing CMS page before a run starts, durably record the matching URL and evidence, transition the linked parent topic from reserved to rejected_duplicate, then cancel only this article case; do not leave the topic ready for repeated allocation. Do not invent evidence, product capabilities, expert observations, cases, statistics, or CTA routes; do not select a table, FAQ, checklist, or other layout device as value by itself. Transition to winning_structure only when the exact payload document is durable and parses as JSON.
      winning_structure:
        owner: MKT Competitive Intelligence Analyst
        instructions: |
          Use all five Winning Structure operations as one resumable lifecycle. Read the winning-structure-input case document, parse its body as JSON, and pass that exact object unchanged to validate_task_input and start_winning_structure_run; never reconstruct, rename, enrich, or guess fields. Reject the handoff before any remote start unless task and market are objects, task_input and namespace are absent, the payload namespace equals winningStructureNamespace, and idempotency_key equals winningStructureIdempotencyKey. Every later plugin call uses company_id, project_id, client_key, run_id, and decisions as top-level parameters exactly as declared by the tool schema; never wrap them in a nested namespace object.

          Validate before any start. A successful validation is valid only when the remote plugin result has valid=true, validation_source=remote_mcp, an input_hash, and task_input_contract_version; a local schema check, a reconstructed payload, or an HTTP 200 alone is never success. If validation is invalid, persist validation_issues with their paths, the input-document digest, and the remote contract version; repair the named fields in strategy_input before using the proven pre-start payload repair transition. Do not transition or retry when the current document digest and validation_issues fingerprint are unchanged: keep this one case in a typed pre-start contract-repair state until the payload itself changes, so a schema failure cannot create an automation loop. This transition is forbidden after any actual current-article MCP run_id or input_hash has been returned. A run ID mentioned only in evidenceRefs, a parent topic, a search-demand case, an opportunity-gate document, or another issue is upstream evidence, not proof that this article case started a run. Reuse an upstream run only when its plugin-returned input_hash exactly equals the current remote validation input_hash and its namespace and idempotency_key exactly equal the current winning-structure-input; otherwise ignore it for lifecycle control. If no current-article winningStructureRunId exists, start exactly once with the same validated object and persist only the plugin-returned run_id, reused status, original input hash, current idempotency key, and current status. If a stored winningStructureRunId exists but its stored input hash or idempotency key differs from the current validated payload, do not import it and do not block for manual repair: clear only the stale runtime indexes, preserve the old run as upstream provenance, start exactly one run for the current taskRevision/idempotency_key, and replace the runtime indexes with that start response. Otherwise poll only the stored current-article run_id and namespace with 5-15 second bounded backoff, exponential delay capped at 30 seconds, safe status retries, and no repeated start. Perform at most 6 status reads in one heartbeat. If the run is still active, persist current status and nextReviewAt in case fields and also PATCH the current automation issue with an executionPolicy monitor whose nextCheckAt matches that value, scheduledBy=assignee, and notes identify the same run_id; keep the issue in_progress. A case field alone is not a continuation path. Never exit a successful heartbeat with an active remote run and no first-class issue monitor. On awaiting_ownership_decision or awaiting_added_value_input, persist the exact pending request and transition this case to structure_decision. On completed, call get result and import full JSON, Markdown, sections, quality requirements, publication requirements, value plans, quality flags, provenance, cache, and cost into durable case documents before retention expiry. Case fields may contain only compact IDs, hashes, status, small counts, selectedValueUnitIds, and short summaries; never copy a raw MCP artifact, section list, quality-requirement object, value-plan list, provenance object, or cost payload into fields. Keep the complete retrieval path in winningStructureResultDocumentId and the typed overlay document. The combined case fields budget is 48 KiB and no individual field may exceed 8 KiB. A paused, failed, expired, transport-blocked, or unresolved run affects only this case; classify it once with nextReviewAt and never stop unrelated cases. Old Serper may supply supporting evidence but cannot complete this gate.

          For every completed run, persist immutable documents winning-structure-result, winning-structure-content-selection-audit, winning-structure-meta-evidence-brief, winning-structure-provider-provenance, and winning-structure-cost. They must preserve original and effective hashes, input/status/result gist_enabled values, content quality and publication requirements, quality_flags, provider attempts, raw artifact refs, cache summary, complete cost telemetry, and retention. Require the three gist_enabled values to agree. content_selection_audit and meta_evidence_brief are recommendation evidence only: never convert them directly into article prose, title, description, or other publishable metadata. Use total_estimated as complete cost only when estimation_status=estimated, telemetry_status=complete, and it is numeric. Treat null as unknown and priced_subtotal under partial pricing as a lower bound, never as total; accept numeric zero only when request telemetry proves no paid operation occurred. Store only the immutable document IDs and winningStructureCostEstimationStatus in compact case fields.

          Verify result provenance against /companies/astrogen/reference/winning-structure-policy.yaml: SERP collection must carry geo, search language, pagination and primary device; competitor text attempts must follow DataForSEO Content Parsing, Serper Scrape, LLMLayer standard, then at most one eligible LLMLayer proxy fallback; Reddit evidence must come only from Reddit API or .json. Visual capture is separate from text capture. If visual evidence is absent or quality_flags contains no_visual_conclusion, no UX or rendered-page conclusion may pass downstream. Preserve every provider attempt and failure rather than reporting only the successful fallback.

          Before the completed case enters structure_review, read the approved units from winning-structure-input.business_context.selected_value_units; compact case fields contain only their IDs and are never the source of the mapping contract. Deterministically verify that every approved selected value unit maps to at least one ordered remote section through its canonical targetIntentCovered values and the section intent_covered list. Persist the resulting mappedSectionIds on the value unit. The remote MCP may add evidence-backed value plans, but it is not the authority that discards an already approved Astrogen value unit. When no generated section maps an approved unit, do not mutate or relabel raw MCP output and do not create a CTO blocker. Create a separate winning-structure-local-overlay document whose typed entry contains overlaySectionId, insertionAfterSectionId, sourceKind=selected_value_unit, sourceValueUnitId, mappedSupportIds, evidenceOrCommitmentRefs, sectionPurpose, writerInstruction, examplesToAvoid, claimBoundaries, and provenance=paperclip_normalization_from_selected_value_unit. A separate accepted-plan overlay remains allowed with provenance=paperclip_normalization_from_accepted_plan. Either overlay is low-risk only when it introduces no new evidence, claim, keyword owner, scope, CTA route, or publication capability. Persist winningStructureOverlayDocumentId and structureMappingStatus=normalized_with_overlay; otherwise set structureMappingStatus=raw_complete. The presence of IDs without full units in compact case fields is expected and is not a blocker. A missing map that would require new claims, scope, ownership, evidence, or plan interpretation is a typed manager-review blocker, not a technical task.
      structure_decision:
        owner: Chief Marketing Officer
        instructions: |
          Fetch current status for the stored run_id using company_id, project_id, client_key, and run_id as top-level plugin parameters; never use a nested namespace object. Copy one exact pending decision_id, decision_version, decision_type, options, required response fields, evidence, and candidate URLs. Submit exactly one decision with company_id, project_id, client_key, run_id, and decisions at the top level only when the selected option and factual rationale are within explicit recorded authority; an identical accepted retry is allowed. For awaiting_added_value_input, submit only produced evidence or a valid /companies/astrogen/reference/article-value-system.yaml commitmentFallbackPolicy commitment for a concrete in-article asset with assigned role, validation method, acceptance criteria, and due_before_publication=true. Never submit semantic-core/ownership/tool access, generic research, more text, keywords, or a layout component as reader value. Never manufacture a version or overwrite a resolved response. Options that accept cannibalization risk, merge/consolidate, reassign ownership, cancel, remove the primary keyword, or otherwise exceed recorded authority require a human review task containing the complete decision request and evidence refs; keep only this case parked at structure_decision with a typed blocker and nextReviewAt. After an authorized submission, return to winning_structure and poll the same run_id. Stale/conflicting decisions require a fresh status read, not a new run. Technical failures are not owner Telegram decisions.
      structure_review:
        owner: SEO Blog Content Plan Validator
        review:
          approver: SEO Blog Content Plan Validator
          approveTo: brief
          requestChangesTo: strategy_input
          rejectTo: cancelled
        instructions: |
          Review only a completed, durably imported Winning Structure result. Read the immutable result, content-selection audit, meta-evidence brief, provider provenance, cost, and overlay case documents through the native case-output routes; case fields are deliberately only a compact index. Verify original/effective hashes, matching input/status/result gist_enabled values, decision history and authority, retention import, evidence-routing order, ownership boundaries, confidence/quality flags, evidence or concrete commitments, content-quality and publication requirements, and every ordered structure item with section_id, level, title, section_type, intent_covered, source_evidence, priority, section_purpose, writer_instruction, examples_to_avoid, and review_flags. Classify every structure item as readerFacing or handoffOnly before approval. CMS/media fields, revision IDs, publication blockers, validation instructions, source/provenance notes, editorial signals, and similar process metadata are always handoffOnly even when a provider emitted them as a numbered section; they must never become reader-facing prose. A no_visual_conclusion flag blocks every visual or UX conclusion but does not create a visual retry requirement when no visual claim is needed. Reject an incomplete strategy handoff where a selected value unit lacks canonical targetIntentCovered; return it to strategy_input before any re-import loop. Approve only when 2-4 accepted value units fit the article type, differ substantively from sibling pages, and preserve claim/privacy boundaries. For western_astrology_learning, inspect every reader-facing heading, purpose and writer instruction against the curriculum: approve only when all value units deepen the same primaryConceptKey, introducedConceptKeys has exactly that one item, every other astrology term has a published prerequisite URL, and excluded future concepts do not appear as definitions, lists, comparisons, workflows, or supporting context. Set curriculumStructureStatus=passed only after this check; otherwise request a new strategy revision. Use the explicit structure_review to winning_structure transition only for same-run re-import or verification of an incomplete import. Every reader-facing scope, section, concept, evidence, value-unit, claim-boundary, ownership, or intent defect requires request_changes to strategy_input, a new taskRevision and a new idempotency key; never send that class of defect back to the same completed run. Never concatenate writer instructions, content-selection audit text, meta-evidence brief text, or handoffOnly sections into article prose, title, description, or metadata, and never treat requirements as a content verdict.

          Accept a separate winning-structure-local-overlay only when structureMappingStatus=normalized_with_overlay, every entry maps either an approved sourceValueUnitId or an accepted sourcePlanId/support ID, provenance is explicit, raw MCP artifacts remain immutable, and the overlay adds no new evidence, claims, scope, ownership, CTA route, or capability. Every selected value unit must map into either a raw section through targetIntentCovered or a valid local overlay before approval.
      brief:
        owner: MKT Blog Brief Strategist
        instructions: |
          Build the Stage 55 brief from the accepted topic and imported Winning Structure result. Read the immutable result, content-selection audit, meta-evidence brief, and overlay case documents through native outputs; use them to justify inclusion and evidence boundaries, never as copy-ready prose or generated metadata. Preserve the complete planning and review record in the canonical `brief` case document. Before transitioning, also create or replace a separate `writer-brief` JSON case document whose UTF-8 body is at most 48000 characters. The writer brief contains only locked basics, search intent, information gain, selected reader-value units, concise source/claim boundaries, CTA and internal-link constraints, avoid constraints, readerFacingSectionIds, and reader-facing sections with section_id, hierarchy, title, type, purpose, writer_instruction, intent_covered, source_evidence and review_flags. It must omit content-selection audit objects, provider provenance, validation instructions, publication blockers, CMS/media fields, revision ledgers, handoffOnly sections and repeated examples-to-avoid payloads. Persist compact `writerBriefDocumentKey=writer-brief`, its revision ID and character count in case fields. Never transition to draft when `writer-brief` is missing, quarantined, truncated, above the limit, or inconsistent with the canonical brief.

          The canonical brief must contain separate readerFacingSectionIds and handoffOnlySectionIds. CMS/media fields, revision IDs, publication blocker notes, validation instructions, source/provenance notes, editorial signals, and `Редакційні сигнали та медіа-поля` are handoffOnly regardless of provider numbering; they cannot appear in the article body. For western_astrology_learning, both brief documents must have a curriculumScope object with primaryConceptKey, introducedConceptKeys containing exactly one matching item, prerequisiteArticleUrls, allowedKnownConceptKeys, excludedFutureConceptKeys, and termBudgetRule=one_new_astrology_concept. Remove any provider section that defines, compares, catalogues, or operationally depends on an untaught concept; calling it supporting context does not make it acceptable. Set curriculumBriefStatus=passed only after the reader-facing structure satisfies this rule. Keep case fields limited to compact brief references, IDs, statuses, title/H1, query cluster, CTA route, category decision, and small verification summaries. Lock title/H1, query cluster, reader intent, information gain, CTA route, internal links, safety constraints, GEO flag, and image mode. Resolve and persist cmsCategorySlug and cmsCategoryTitle from the approved Astrogen CMS delivery policy before layout: a topic/service-specific approved category wins over the article-type default, and a product route must use its matching service category. The approved v1 article-type defaults are zodiac_profile=astrologiya, product_education=inshi, expert_method_selection=eksperty, life_situation_decision=inshi, concept_explainer=astrologiya, relationship_compatibility=stosunky, forecast_cycle=free-horoscope, historical_cultural_explainer=inshi. These stable slugs are an approved equivalent of /companies/astrogen/reference/cms-delivery-policy.yaml, so a missing filesystem path alone is not a blocker. Do not persist numeric CMS IDs, create taxonomy, or defer this relation decision to the CMS writer. Transition to draft only after both brief documents and compact field references are durable. Do not write the final article, create generic value blocks, or copy raw prompt text.
      draft:
        owner: SEO Blog Article Writer (Claude)
        instructions: |
          Write the canonical Ukrainian Stage 59 draft only from the complete injected `writer-brief` document and its readerFacingSectionIds. Never reconstruct the brief from case fields or use a missing, redacted, or truncated inline document. Claude is the primary writer. For western_astrology_learning, teach exactly the one primary concept named by curriculumScope. Do not define or compare any future concept, enumerate a family such as twelve houses or twelve signs, or add an interpretation workflow that requires untaught terminology. A synonym such as дім/будинок/дом is an alias of the same concept, not another lesson. Previously published prerequisites may be named briefly and linked, but not retaught. Never place handoffOnly material in reader-facing prose: exclude CMS/media fields, revision IDs, publication blocker notes, validation instructions, source/provenance notes, editorial signals, and any section titled `Редакційні сигнали та медіа-поля`, even when an older brief numbered it as a normal section. Preserve those details only in artifact metadata or handoff notes outside the clearly delimited article body. On a validate-to-draft return, read the latest content-validation case document and apply its deterministic corrections before following the older brief; do not repeat a rejected section merely because it remains in an immutable provider result. Create a durable attachment-backed work product, update the case with its artifact reference, and transition to validate. Do not perform layout, image generation, CMS work, or Telegram delivery.
      validate:
        owner: SEO Blog Article Validator
        review:
          approver: SEO Blog Article Validator
          approveTo: humanize
          requestChangesTo: draft
          rejectTo: cancelled
        instructions: |
          Validate the canonical draft against the accepted brief and imported Winning Structure sections. Approve only when every selected value unit is supported by its evidence or fulfilled commitment, sibling differentiation is substantive, publication requirements and claim/privacy boundaries are met, SEO locks are preserved, and no process or raw-prompt residue remains. For western_astrology_learning, scan headings, definitions, tables, lists, examples and FAQ for astrology terms. Persist detectedNewConceptKeys and curriculumValidationStatus; approve only when the array contains exactly primaryConceptKey, every other astrology term is a linked published prerequisite or an alias of the primary concept, and no future concept is taught as supporting context. When the curriculum permits one unavoidable supporting term, require its supportingTermGlossary entry and an immediate one-sentence plain-language definition at first use; reject if it gets separate teaching depth. Set supportingTerminologyValidationStatus=passed only after that check. More than one new concept is a substantive revision, never a style note. Interpretive systems must not be presented as scientific proof, diagnosis, guaranteed prediction, or deterministic/fatalistic fact. Use the native pipeline review decision: approve to humanize, request changes to draft with deterministic reasons, or reject only with durable evidence.
      humanize:
        owner: SEO Blog Humanizer
        instructions: |
          Perform exactly one bounded editorial-naturalness pass under /companies/astrogen/reference/content-quality-contract.yaml. Correct only observed prose anti-patterns such as throat-clearing, formulaic openers/closers, repetitive transitions or sentence shapes, vague abstraction, forced triads, and unnecessary meta-rubrication. Preserve accepted structure, section IDs, evidence, claims, qualifiers, SEO locks, value units, CTA, and publication requirements. Do not invent a persona or experience, add deliberate errors, calculate an AI score/percentage, attribute a model, or recurse. Register the durable humanized artifact and transition to mc_quality.
      mc_quality:
        owner: SEO Blog Article Validator
        instructions: |
          Audit the final humanized main content under /companies/astrogen/reference/content-quality-contract.yaml before layout. Check purpose fulfillment, visible effort, evidence-backed originality and value, depth, usefulness, completeness, specificity, clarity, information density, sibling differentiation, claim safety, and delivered publication-blocking commitments. For western_astrology_learning, repeat the one-concept scan after humanization, persist mcDetectedNewConceptKeys and curriculumMcQualityStatus, and pass only when exactly primaryConceptKey is newly taught. An alias does not add a concept; a definition, comparison, catalogue, example, FAQ answer, or workflow using an untaught astrology term does. Recheck the declared supportingTermGlossary after humanization: the one allowed term must still be defined immediately in plain language and must not have gained separate teaching depth. Set supportingTerminologyMcStatus=passed only after that check. Route concept overload to revise_substantive. Run selective GEO/retrievability checks only when geoRetrievabilityRequired=true and the case is an eligible explanatory or refresh scope; these checks are answer-first, explicit-entity, and self-contained-fragment checks, never keyword-density or quota gates. Persist mcQualityOutcome as exactly pass, revise_surface, revise_substantive, or reject_unsafe with section/evidence-linked findings. Route pass to layout. A first revise_surface increments mcQualitySurfaceRevisionCount and permits exactly one finding-bounded humanize correction; a second surface failure must become revise_substantive or reject_unsafe. A revise_substantive increments mcQualitySubstantiveRevisionCount and returns to draft, but at most two substantive revisions are allowed for one taskRevision; the next failure becomes reject_unsafe or a manager-reviewed new taskRevision. Reject_unsafe routes to cancelled. Do not emit AI-detector scores or approve layout as a substitute for weak main content.
      layout:
        owner: SEO Blog Article Layout Editor
        instructions: |
          Convert the accepted article into canonical articleContent.v1 under /companies/astrogen/reference/content-quality-contract.yaml. Include the early editorialCallout titled exactly Коротко with variant exactly soft, useful later editorial blocks, final quiet CTA, and a related-post selection plan. Brand and situation variants remain valid only for later callouts. Every paragraph block must carry string text; when spans are present, preserve them and set text to their exact concatenated visible text. A spans-only paragraph is invalid. Every iconList item must use one exact allowed icon from articleContentV1.iconList.allowedIcons; never invent an editorial-* alias. The durable CMS-ready envelope must include non-empty seoTitle and metaDescription and preserve articleType plus cmsCategorySlug/cmsCategoryTitle from the accepted brief; do not replace them with a numeric CMS id or infer them from visible text. Treat an unknown icon, missing seoTitle, or missing metaDescription as an incomplete layout and repair it in this stage before transition. Store layout JSON durably and transition to layout_validate. Do not generate images or mutate CMS.
      layout_validate:
        owner: SEO Blog Article Layout Validator
        review:
          approver: SEO Blog Article Layout Validator
          approveTo: image
          requestChangesTo: layout
          rejectTo: cancelled
        instructions: |
          Validate articleContent.v1 under /companies/astrogen/reference/content-quality-contract.yaml, the early Коротко callout with variant exactly soft, CTA, related-post plan, visible copy, and absence of schema/process residue. Deterministically reject any paragraph without string text or whose text differs from the concatenated spans[].text when spans exist; do not approve a spans-only paragraph and leave this repair to CMS. Reject any twoColumnText block whose leftBody or rightBody is empty, any iconList icon outside articleContentV1.iconList.allowedIcons, and require non-empty CMS-ready SEO title and meta description before approval. For human_scene cover direction, require one explicit typed gaze plan but never require a viewer-facing candidate or final image: viewer-facing is valid only when it strengthens the lived emotional event, while interaction/object/off-camera gaze is equally valid when it explains the topic better. Use the native review decision: approve to image, request changes to layout, or reject with durable evidence.
      image:
        owner: SEO Blog Image Runtime Executor
        instructions: |
          When operation=refresh and the current accepted cover has no explicitly scoped defect, preserve its media IDs, register reuse evidence, and transition to cms_draft without a provider call. Otherwise, before spending provider budget, call paperclip.openrouter-image-agent-tools:image-visual-history-get and inspect the latest 6-8 structured fingerprints. Generate one normal cover with the configured default model and one candidate. For human_scene, send subjectMode=human_scene and a complete typed artDirection: narrative moment, scene archetype, setting, subject arrangement, action, a specific emotional beat with at least two visible cues, shot distance, camera angle, gaze plan, props, brand anchors, and avoid patterns. The new plan must differ from every recent fingerprint on at least 4 of 9 visual axes. Treat Astrogen burgundy/wine, warm gold, soft neutral light, and restrained esoteric detail as accents rather than a repeated wardrobe/room/table formula. A neutral seated person with laptop, notebook, cup, or generic calm expression does not pass.

          Persist coverImageProviderCallCount after each paid call. A second and final corrective call is allowed only when image_recovery_review has set coverImageRetryAuthorizationCount=1 and coverImageRetryAuthorizedAt after a hard visual QA failure; no other retry is allowed. Request 1472x822, then inspect actual dimensions and visual quality. Accept and preserve the original when width and height deviations are each at most 20 percent and visual QA passes; never upscale, stretch, destructively crop, convert only for format, or call the provider again solely for a within-tolerance mismatch. Register one attachment-backed work product with the visual fingerprint and visible emotion evidence, then transition to cms_draft. For readable text, numbers, glyph clutter that resembles language, fabricated screen content, or another recorded hard visual QA defect, persist exact evidence and transition to image_recovery_review. A familiar non-linguistic pictogram, a small decorative stroke, or repeated lines that do not form readable letters, words, numbers, controls, or fake interface content are not pseudo-writing by themselves. Do not block this stage, ask the owner, or self-authorize a paid retry. A larger dimension miss is a typed runtime blocker, not an automatic retry.
      image_recovery_review:
        owner: Chief Marketing Officer
        instructions: |
          Act only as the bounded recovery authority for a rejected cover; do not generate an image, call a provider, mutate CMS, or send Telegram. Read case-visible QA evidence and visually inspect the latest cover candidate before deciding. A hard visual QA failure means readable text, numbers, glyph clutter that resembles language, fabricated screen content, or another explicit visual-policy defect. A familiar non-linguistic pictogram, a small decorative stroke, or repeated lines that do not form readable letters, words, numbers, controls, or fake interface content are not pseudo-writing by themselves. Dimension or output-format deviation within the per-axis 20 percent tolerance is never a hard failure and never authorizes a retry.

          If the rejected candidate is a hard visual QA failure, coverImageProviderCallCount is exactly 1 (normalize a legacy missing count to 1 only when the candidate and one provider-call evidence exist), and coverImageRetryAuthorizationCount is absent or 0, merge fields to set coverImageRetryAuthorizationCount=1, coverImageRetryAuthorizedAt, coverImageRetryReason, and concise negative retry constraints. Clear only the actionable blocker fields, retain the rejected-candidate evidence, and transition to image with label authorize_one_corrective_retry. This is CMO authority and does not require owner approval.

          If the latest candidate passes this visual review, its width and height are each within tolerance, and the exact workspace file is durable, register that existing file as one attachment-backed approved work product, merge acceptance evidence into the case, clear only actionable image blocker fields, and transition directly to cms_draft with label accept_existing_after_visual_review. This path never calls the provider and is valid after a false-positive first-pass QA decision or after the one corrective retry.

          If the retry was already authorized and the latest candidate still has a proven hard defect, do not make a second authorization, do not ask the owner for a technical choice, and do not close the article as delivered. Record a typed final recovery outcome with the exact evidence and keep only this case blocked while unrelated article cases continue. Never treat a dimension-only mismatch as image_quality_blocked.
      cms_draft:
        owner: SEO CMS Technical Fixer
        instructions: |
          Consume only accepted pipeline artifacts. For operation=create, make one typed payload_cms_create_blog_post_draft call with articleType and the accepted cmsCategorySlug/cmsCategoryTitle when a topic-specific category was selected. The company-scoped CMS plugin is the canonical relation resolver: it idempotently resolves the default Astrogen editorial author and the approved article-type category before its single Payload create. Do not pre-call raw CMS APIs, guess numeric relations, omit articleType, or trial-and-error author/category fields. An explicitly scoped expert article must instead pass its verified author relation.

          Before media upload or any CMS mutation, call payload_cms_validate_article_content on the accepted articleContent.v1 and require a valid result. Also verify every paragraph has string text and that it equals concatenated spans[].text when spans exist, every twoColumnText side is non-empty, every iconList icon belongs to the canonical registry, the early Коротко callout uses variant exactly soft, and the CMS-ready envelope has non-empty SEO title and meta description. Any mismatch must return to layout validation instead of uploading media, using the CMS create/update call as a validator, or trying alternate Payload shapes. Then upload the accepted cover, create or update one Payload CMS draft, set exactly three valid relatedPosts, and perform an authenticated depth=1 refetch. The gate passes only when the refetch returns exactly three distinct expanded relation objects and each has _status=published, workflowStatus=approved, and noindex=false; three submitted numeric IDs are not delivery proof. Verify articleContent.v1, Коротко, CTA, cover/OG media and this resolved relation evidence. Keep draft-only. Copy cmsAdminUrl exactly from the Payload plugin returned adminUrl; never construct, slugify, translate, or change its collection segment. For Astrogen it must start with https://cms.astrogen.com.ua/admin/collections/blogPosts/. Write cmsDraftId and this exact cmsAdminUrl to the case, and transition to cmo_delivery. Never publish. If relation resolution fails, record cms_relation_policy_missing with the exact adapter evidence, retain the same case/stage, and route the repair to the CMS delivery policy rather than asking the owner for a technical choice.

          For western_astrology_learning, re-read the accepted curriculum validation, supporting-term glossary, and MC evidence before CMS mutation. Set curriculumDeliveryStatus=passed and supportingTerminologyDeliveryStatus=passed only when both gates identify exactly one new concept equal to primaryConceptKey, the one permitted supporting term is immediately glossed without separate teaching depth, and the CMS body has not added another astrology definition in layout. Otherwise return to layout or substantive draft revision; never create or update a CMS draft with concept overload or unexplained terminology.
      cmo_delivery:
        owner: Chief Marketing Officer
        review:
          approver: Chief Marketing Officer
          approveTo: delivered
          requestChangesTo: cms_draft
          rejectTo: cancelled
        instructions: |
          Act as the final delivery reviewer. Verify the CMS draft/admin URL and all completion evidence. For western_astrology_learning, compare the CMS body with the canonical curriculum node and set curriculumFinalReviewStatus=passed only when one article teaches exactly primaryConceptKey, prerequisite links are present where needed, and no untaught astrology concept appears as a definition, list, comparison, FAQ answer, workflow, or supporting context. Verify the declared supporting term, when present, is defined immediately in one plain-language sentence and has no separate teaching depth; then set supportingTerminologyFinalReviewStatus=passed. Also require the first Коротко callout to use variant exactly soft. Require cmsAdminUrl to be the exact plugin-returned URL and to start with https://cms.astrogen.com.ua/admin/collections/blogPosts/; never construct, slugify, translate, or change the collection segment. If valid Telegram delivery proof already exists in case fields, reuse it and do not send a duplicate. Otherwise send exactly one gender-neutral Ukrainian Telegram message containing only the article title and that CMS admin edit URL, then record ok=true, messageId and delivery-proof writeback. For operation=create, verify the linked topic is reserved by this article case; the native children-terminal outcome contract consumes that topic atomically after approval moves this article to delivered. Never mutate the topic lifecycle manually. For operation=refresh or repair, require the verified before-after diff and do not require or mutate a topic reservation. Submit the native review decision approve only after Telegram delivery proof and the operation-specific gate succeed. Request changes to cms_draft when final CMS evidence is incomplete, or reject only with durable evidence. Never use a direct case transition, resend an existing delivery, or send internal stage or technical status.
    invariants:
      - blocked cases do not consume productive WIP
      - one task revision maps to one Winning Structure idempotency key and one resumable run
      - raw Winning Structure artifacts live in immutable case documents; article case fields stay below 48 KiB and retain only compact references
      - namespace and stored run_id are reused for every status, decision, and result operation
      - Winning Structure tool parameters are always top-level and never wrapped in a nested namespace object
      - strategy_input never writes MCP run, status, hash, decision, retention, or result fields; winning_structure populates them only from plugin responses
      - winning-structure-input is exact tool payload JSON and is passed unchanged to validation and start
      - winning_structure may return to strategy_input only before a real MCP run or input hash exists
      - a paused Winning Structure run parks only its article case and never freezes unrelated topic or growth cases
      - completed Winning Structure result, quality requirements, decisions, and required artifacts are imported before retention expiry
      - gist_enabled defaults to true; baseline comparison requires a separately authorized task revision and idempotency key, and Paperclip review remains the winner authority
      - content_selection_audit and meta_evidence_brief are durable recommendation evidence and never publishable prose or generated metadata
      - every structure/brief section is typed readerFacing or handoffOnly; operational CMS/media/provenance/validation sections never enter article prose
      - provider attempts follow the Phase 32 evidence route and no_visual_conclusion blocks visual or UX claims
      - only estimation_status=estimated with complete telemetry may become a Paperclip cost ledger event; partial subtotal is a lower bound and null is unknown
      - raw MCP artifacts are immutable; a missing mapping for an approved selected value unit or accepted remote plan uses a separate typed Paperclip normalization overlay or a manager-review blocker
      - expired temporary artifacts are recoverable only from an already imported result or an explicitly new task revision
      - old Serper evidence may support input but never completes the Winning Structure gate
      - accepted articles require non-SERP evidence or a fulfilled publication-blocking commitment
      - each article has exactly one of eight approved article types and 2-4 evidence-backed type-appropriate value units
      - western_astrology_learning articles introduce exactly one new concept; value units may deepen it but never add adjacent concepts
      - layout devices are not value by themselves and no universal value block is applied across article types
      - final MC quality runs after humanize and before layout with one of four typed outcomes
      - one task revision allows at most one surface MC correction and two substantive MC corrections
      - naturalness correction is bounded and never uses AI percentages, model attribution, invented personas, or recursive rewriting
      - GEO retrievability checks run only when explicitly flagged for an eligible explanatory or refresh case and never enforce keyword density
      - operation create never requires before-after-diff
      - operation refresh or repair requires child-owned before-after-diff before CMO aggregation
      - CMS remains draft-only
      - operation refresh reuses accepted existing media unless an image defect is explicitly scoped
      - delivered requires cmsAdminUrl, Telegram messageId, and delivery-proof writeback
      - create delivery always carries articleType; the CMS plugin resolves default author/category from company-scoped policy before its only Payload create
      - brief and layout persist a slug/title category policy, never numeric CMS relation IDs
      - operation create atomically consumes the linked reserved topic through the native children-terminal outcome when the article transitions to delivered
      - operation refresh or repair requires verified before-after diff and does not require a topic reservation
      - recovery resumes the same case and stage
      - technical stage status and blocker details are never sent through owner-facing Telegram
      - image stage requests 1472x822 but accepts the original asset when width and height deviations are each at most 20 percent and visual QA passes
      - image dimensions or output format within tolerance never trigger a second provider call or upscale
      - human-scene image generation requires typed emotional art direction and company-scoped visual-history preflight before provider spend
      - a human-scene concept with fewer than 4 distinct visual axes against a recent fingerprint is corrected before generation, not accepted as another similar cover

  - key: astrogen-search-demand-opportunities
    name: Astrogen Search Demand Opportunities
    description: Native decision ledger that turns search demand into one ownership-safe action before any topic inventory intake.
    writerAgents:
      - SEO Blog Content Strategist
    enforceTransitions: true
    caseKey: search-demand:<opportunityFingerprint>
    requiredFields:
      - opportunityFingerprint
      - discoveredAt
      - discoverySources
      - primaryQuery
      - queryCluster
      - intentClusterKey
      - clusterDedupeKey
      - queryFamilyFingerprint
      - supportingQueries
      - sourceSemanticCandidateIds
      - sourceClusterIds
      - portfolioLane
      - contentPortfolioTrack
      - intent
      - semanticOpportunityId
      - semanticClusterId
      - primaryAudienceSegmentId
      - secondaryAudienceSegmentIds
      - trendReportRunId
