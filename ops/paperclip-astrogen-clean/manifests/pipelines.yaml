                western_astrology_learning: 12
                audience_applied_questions: 5
                audience_trends: 3
                trust_expert_method_boundaries: 3
                commercial_unmet_demand: 2
              activeOnly: true
              whenCaseField: actionType
              whenCaseFieldEquals: topic_inventory_refill
      - { key: measured, name: Measured, kind: done, position: 900 }
      - { key: rejected, name: Rejected, kind: cancelled, position: 1000 }
      - { key: external_wait, name: External Wait, kind: working, position: 1100 }
    transitions:
      - { from: finding, to: portfolio_review }
      - { from: portfolio_review, to: delegated, label: accepted }
      - { from: portfolio_review, to: finding, label: request changes }
      - { from: portfolio_review, to: rejected, label: rejected }
      - { from: delegated, to: executing }
      - { from: executing, to: verify }
      - { from: executing, to: external_wait }
      - { from: external_wait, to: executing }
      - { from: verify, to: measured, label: verified }
      - { from: verify, to: executing, label: request changes }
      - { from: verify, to: rejected, label: rejected }
      - { from: measured, to: executing, label: outcome regressed below SLO }
      - { from: finding, to: rejected }
    stageAutomation:
      finding:
        owner: SEO Performance Analyst
        instructions: |
          Normalize one evidence-backed finding into a stable findingFingerprint, actionClass, business outcome, evidence refs, blocker class, measurement window and proposed executor. Update this same case on repeated evidence and transition to portfolio_review.
      portfolio_review:
        owner: Chief Marketing Officer
        review:
          approver: Chief Marketing Officer
          approveTo: delegated
          requestChangesTo: finding
          rejectTo: rejected
        instructions: |
          Decide continue, stop, recover or accept as a new growth action. Approve only with outcome metric, accountable manager, specialist executor, completion proof and review date. Use the native review decision; do not execute specialist work.
      delegated:
        owner: Chief Marketing Officer
        instructions: |
          Create or link one bounded specialist execution path for the accepted action, set executorId and nextReviewAt, and transition to executing. A blocked unrelated action must not stop this case or other lanes.
      executing:
        owner: Chief Marketing Officer
        instructions: |
          Manage the linked specialist execution path without doing the specialist work. Read case-visible work products after every create/link operation and whenever a linked work issue becomes terminal. A delegated worker publishes documents and work links but does not need astrogen-growth-actions pipelines:write; the CMO source owner consumes those outputs and updates this case. Every delegated trend or semantic-review issue must receive the sourceCaseId and a stable resultDocumentKey in its task. Before terminal done it must PUT the complete typed result into that source case document and also retain the bounded description projection; a terminal child summary is never a substitute for the document. Durable positive completion evidence transitions to verify. When a worker reaches a native transition, review, or guarded create that requires a configured approver, the worker writes a typed needs_manager_action result with the target case, requested action, expected version, and evidence refs, then completes its specialist issue. The CMO performs the action when it owns that approval; otherwise it delegates one bounded approval issue to the configured approver and relies on the linked-work terminal wake to continue this same source case. Never classify an internal configured-approver duty as an external blocker, and never let a specialist issue block its manager solely because the specialist lacks approval authority. Before any guarded curriculum intake, query all direct topic children and matching curriculumNodeId/primaryConceptKey across nonterminal and terminal stages. A consumed topic or delivered article means that curriculum node is already fulfilled: never recreate, revive, or count it as future supply; record the fulfilled node and delegate the first prerequisite-ready missing curriculum node instead. For topic_inventory_refill, a terminal continuation that reports counts below 25 or any 12/5/3/3/2 track deficit requires one bounded next-lane continuation plus a due source-owner monitor; it is not success and cannot be left in executing without a live path. When delegating audience-trend evidence that may use Semantic Core, state the actual supported non-core layer: audience_need_intent for concrete audience problems/questions and audience_interest_intent for broader editorial interests. audience_trends is a Paperclip portfolio track, never a Semantic Core layer or plugin enum. If the intended semantic layer is ambiguous, delegate an evidence handoff that names the ambiguity instead of authorizing a guessed run-layer call. A blocked specialist issue with a durable blocker artifact is classified once: only a genuinely external dependency may set blockerClass and nextReviewAt and transition to external_wait; keep other cases moving. Only a missing artifact may create or reuse one bounded evidence-recovery issue through atomic pipelineCaseLink; after linking it, re-read outputs in the same heartbeat. Never create a recovery chain or leave the case in executing when the linked artifact already proves a durable external dependency.
      verify:
        owner: SEO Performance Analyst
        review:
          approver: SEO Performance Analyst
          approveTo: measured
          requestChangesTo: executing
          rejectTo: rejected
        instructions: |
          Verify implementation and the defined outcome evidence. For topic_inventory_refill, query current non-retired astrogen-topic-inventory ready and reserved stages after every candidate validator has finished and count only lineage-valid cases with selectedAction=new_article, a guarded search-demand parent, and exactly one contentPortfolioTrack: candidate, evidence_ready, consumed, rejected_duplicate, lineage-invalid legacy and narrative case IDs do not count. Approve to measured only when at least 25 eligible future topics exist and track counts satisfy western_astrology_learning=12, audience_applied_questions=5, audience_trends=3, trust_expert_method_boundaries=3, commercial_unmet_demand=2. Audience segments are reported for diversity but have no hard quota. Require next-content-plan to list the same native case IDs and fields. The native stage-count/quota gate enforces the same matrix independently. If total or any track is below target, request changes to executing with exact deficits.
      external_wait:
        owner: Chief Marketing Officer
        instructions: |
          Treat the current typed case fields as authoritative; a stale linked issue or artifact never overrides them. Before preserving any wait, inspect current case-visible evidence. If the required next action is a native review, approval, transition, or guarded create reserved for the configured Chief Marketing Officer approver, it is an internal manager duty regardless of a worker's finalDisposition or blocker label: clear blockerClass/blockerOwner/blockerAction, transition this source case to executing in the same heartbeat, and do not schedule a monitor or create recovery work. For topic_inventory_refill, first count every incomplete contentPortfolioTrack and its source-lane continuation. An external wait belongs only to the named lane: before keeping a trend, provider, or low-inventory cooldown, verify that every other deficient lane has its own live continuation or durable future monitor. If any other deficient lane lacks one and can proceed through the approved curriculum, semantic, trust, commercial, or audience source, clear the global wait, transition this same refill case to executing, and delegate or reuse exactly one bounded continuation for that next lane. A cooldown for audience_trends never parks other portfolio deficits. If executionStatus=waiting_next_day_trend_research, blockerClass=bounded_trend_cooldown, ownerActionRequired=false, and nextReviewAt is still in the future, keep this case in external_wait only after that source-lane check succeeds, even when an older blocker issue is done. PATCH this same automation issue with executionPolicy.monitor.nextCheckAt equal to case.nextReviewAt, executionPolicy.monitor.scheduledBy=assignee, and concise notes naming the case and cooldown reason; keep the issue in_progress and exit without comments, owner notifications, new issues, or a stage transition. At the monitor wake, re-read ready inventory and the per-Kyiv-day paid trend-run bound. Transition to executing only when a real continuation exists: eligible ready topics, or a permitted fresh/reused bounded trend run with a durable execution path. If the prior trend report is exhausted and the daily bound still forbids a run, advance one bounded monitor to the next permitted review time and remain in external_wait. For other genuinely external dependencies, keep the named owner and nextReviewAt visible and transition back to executing only on current case-visible evidence that enables concrete work. Never poll through repeated comments and never freeze unrelated growth actions.
          For every typed external cooldown with ownerActionRequired=false and a future nextReviewAt, including any new low-inventory or provider cooldown class, PATCH this same external-wait automation issue with executionPolicy.monitor.nextCheckAt equal to case.nextReviewAt, scheduledBy=assignee, and concise typed notes. Keep it in_progress; a case field, comment, or completed automation alone is never a continuation path.
    invariants:
      - auto_execute findings require an execution case before weekly cycle completion
      - owner_decision is the only class routed to the owner
      - external_dependency has nextReviewAt and does not freeze other actions
      - bounded next-day trend cooldown remains in external_wait until its typed nextReviewAt permits a real continuation; stale blocker closure cannot resume it
      - every future typed external cooldown retains one in_progress external-wait automation issue with executionPolicy.monitor.nextCheckAt equal to case.nextReviewAt
      - duplicate fingerprints update one case instead of creating repeated blockers
      - executing evidence resolves deterministically to verify, external_wait, or one bounded recovery; a durable blocker artifact never creates another recovery chain
      - manager-only approval is returned as needs_manager_action and consumed by the CMO; it never becomes an external blocker or a specialist-to-manager blocks relation
      - external_wait immediately returns configured CMO approval duties to executing regardless of a stale worker blocker label
      - a topic-inventory refill external wait is lane-specific and cannot park another incomplete portfolio track without its own live continuation or monitor
      - consumed or delivered curriculum nodes are fulfilled history, never recreated or counted as future supply; refill advances to the next prerequisite-ready missing node
      - topic inventory refill cannot enter measured while ready plus reserved eligible supply is below 25 or any contentPortfolioTrack is below its 12/5/3/3/2 target
      - a measured refill may return to executing when its ready-inventory outcome regresses below the low-water mark
