secrets:
  requiredNow:
    - key: astrogen_payload_cms_api_key
      owner: Chief Technical Officer
      usedBy:
        - paperclip.payload-cms-agent-tools
    - key: crawlobserver-api-key
      owner: Chief Technical Officer
      usedBy:
        - paperclip.crawlobserver-agent-tools
    - key: search-console-mcp-astrogen-token
      owner: Chief Technical Officer
      usedBy:
        - paperclip.gsc-bing-ga4-mcp-agent-tools
    - key: telegram.bot_token.astrogen_ai_bot
      owner: OPS Human Interaction Agent
      usedBy:
        - paperclip-plugin-telegram
    - key: resend-api-key
      owner: Chief Marketing Officer
      usedBy:
        - paperclip.seo-performance-loop
        - paperclip.email-notifications
      requiredBindings:
        - target: paperclip.seo-performance-loop
          configPath: settings.resendApiKeySecretRef
        - target: paperclip.email-notifications
          configPath: settings.resendApiKeySecretRef
        - target: SEO Performance Analyst
          configPath: resendApiKeySecretRef
    - key: openrouter_api_key_4texts
      owner: Chief Marketing Officer
      usedBy:
        - SEO Blog Article Writer (Claude)
    - key: openrouter_api_key_4images
      owner: Chief Marketing Officer
      usedBy:
        - paperclip.openrouter-image-agent-tools
        - SEO Blog Image Runtime Executor
  providerFallbackParked:
    - key: dataforseo-api-login
      owner: SEO Performance Analyst
      activation: disabled until plugin packaging and smoke pass
    - key: dataforseo-api-password
      owner: SEO Performance Analyst
      activation: disabled until plugin packaging and smoke pass
    - key: serper-api-key
      owner: SEO Performance Analyst
      activation: disabled until plugin packaging and smoke pass
    - key: exa-api-key
      owner: SEO Performance Analyst
      activation: disabled until plugin packaging and smoke pass
  optionalParked:
    - key: collaborator-api-key
      owner: Chief Marketing Officer
      activation: disabled until external publisher catalog access is approved
    - key: bright-data-api-token
      owner: Chief Technical Officer
      activation: disabled until explicit crawling budget approval
  doNotMigrate:
    - key: openrouter-api-key
      reason: disabled legacy key; use split text/image keys

policy:
  valueHandling: never print or commit plaintext values
  migration: decrypt old local_encrypted value in memory and re-encrypt with clean master key
  verification:
    - clean secret metadata exists by key
    - latest version is current
    - plugin config references clean secret ids
