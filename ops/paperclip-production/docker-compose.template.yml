services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paperclip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-paperclip}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paperclip} -d ${POSTGRES_DB:-paperclip}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - paperclip_pgdata:/var/lib/postgresql/data

  app:
    image: ${PAPERCLIP_APP_IMAGE:-paperclip-app:v2026.513.0-phase17.1}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-paperclip}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-paperclip}
      HOST: 0.0.0.0
      PORT: "3100"
      SERVE_UI: "true"
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: private
      PAPERCLIP_PUBLIC_URL: ${PAPERCLIP_PUBLIC_URL}
      PAPERCLIP_AGENT_API_URL: ${PAPERCLIP_AGENT_API_URL:-http://127.0.0.1:3100}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    ports:
      - "127.0.0.1:${PAPERCLIP_HOST_PORT:-3200}:3100"
    volumes:
      - paperclip_data:/paperclip
      - /home/paperclip/astrogen:/astrogen
      - /home/paperclip/companies:/companies

volumes:
  paperclip_pgdata:
  paperclip_data:
